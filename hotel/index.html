<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>호텔 라스트 체크아웃</title>
<meta name="description" content="마음에 짐이 남은 사람들이 머무는 호텔. 방마다 숨은 미련을 풀어 손님을 체크아웃시키고, 잃어버린 내 기억을 되찾는 방탈출 게임.">
<meta name="theme-color" content="#17131f">
<meta property="og:type" content="website">
<meta property="og:title" content="호텔 라스트 체크아웃">
<meta property="og:description" content="체크아웃은 언제든 가능합니다. 마음의 짐만 내려놓으신다면.">
<meta property="og:image" content="https://ykooon0830-source.github.io/mung-walk/hotel/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 세로 화면 방탈출: 9:16 판 하나가 화면 가운데에 놓이고, 그림 위에 투명한 조사 지점을 겹쳐요.
   아래쪽에는 목표 줄과 소지품 칸이 있고, 대사는 화면 어디를 눌러도 넘어가요. */
:root{
  --bg:#17131f; --paper:#f4e7cd; --paper2:#efe0c2; --ink:#2b2233; --muted:#8a7a6a;
  --brass:#e3ab5c; --rose:#d27a84; --wine:#8c2f3a; --sepia:#3a2a1c;
  --f-hand:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-title:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.stage{position:relative;width:min(100%, calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16));
  aspect-ratio:9/16;overflow:hidden;container-type:inline-size;background:#000;font-family:var(--f-hand);color:var(--ink)}
@media (min-width:600px){.stage{border-radius:18px;box-shadow:0 20px 60px #000a}}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bg.blur{filter:blur(7px) brightness(.3) saturate(.8);transform:scale(1.12)}
.scene{position:absolute;inset:0}
.view{position:absolute;left:0;right:0;top:0}
.view>img{display:block;width:100%;height:100%}
.view.panel{box-shadow:0 2cqw 6cqw #000c}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:60}
.fade.on{opacity:1}

/* 조사 지점 */
.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:12px}
.hot:focus-visible{outline:3px solid var(--brass)}
.hot.ping::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 0 2px #fff8 inset,0 0 18px #ffd98f;animation:ping 1.4s ease-out 2 forwards}
@keyframes ping{from{opacity:1}to{opacity:0}}
.hot.flash::after{content:"";position:absolute;inset:0;border-radius:12px;background:#fff3;animation:ping .4s ease-out forwards}
.sparkle{position:absolute;width:3.2cqw;height:3.2cqw;margin:-1.6cqw;border-radius:50%;background:radial-gradient(#fff,#ffd98f 40%,transparent 70%);
  pointer-events:none;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1)}}

/* 위쪽 HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:2cqw;
  padding:3cqw 3.4cqw 6cqw;z-index:20;background:linear-gradient(#000b,#0000);font-size:4.1cqw;color:var(--paper);pointer-events:none}
.hud>*{pointer-events:auto}
.pill{background:#0009;border:1px solid #fff3;border-radius:99px;padding:.4cqw 3cqw;white-space:nowrap}
.hbtn{font:inherit;color:var(--paper);background:#0009;border:1px solid #fff3;border-radius:99px;padding:.4cqw 3cqw;cursor:pointer}
.hbtn:focus-visible{outline:2px solid var(--brass)}

/* 아래쪽: 목표 줄 + 소지품 */
.bottom{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;z-index:22;display:flex;flex-direction:column;gap:2cqw}
.goal{display:flex;align-items:center;gap:2cqw;background:#120d18e6;border:1px solid #e3ab5c66;border-radius:3cqw;padding:1.8cqw 2.4cqw 1.8cqw 3.4cqw;color:var(--paper);font-size:4.2cqw;line-height:1.25}
.goal .tag{color:var(--brass);white-space:nowrap}
.goal .txt{flex:1;min-width:0}
.goal .hint{font:inherit;font-size:3.9cqw;background:var(--brass);color:var(--ink);border:0;border-radius:2.4cqw;padding:.8cqw 2.6cqw;cursor:pointer;white-space:nowrap}
.goal.new{animation:goalnew .9s ease-out}
@keyframes goalnew{0%{box-shadow:0 0 0 0 #e3ab5c}100%{box-shadow:0 0 0 3cqw #e3ab5c00}}
.inv{display:flex;gap:1.8cqw}
.slot{flex:1;height:15cqw;border-radius:3cqw;background:#0009;border:1px dashed #fff4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;
  color:var(--paper);font-size:3.1cqw;text-align:center;line-height:1.05;padding:.6cqw;font-family:inherit}
.slot.got{border:2px solid var(--brass);background:#3a2a1cdd;cursor:pointer}
.slot.fresh{animation:got .5s ease-out}
@keyframes got{from{transform:scale(1.4)}}
.slot svg{width:8cqw;height:8cqw}

/* 대사창 */
.taplayer{position:absolute;inset:0;z-index:29;cursor:pointer}
.dlg{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;z-index:30;background:var(--paper);border-radius:4cqw;
  padding:5.4cqw 4.4cqw 7cqw;font-size:5.2cqw;line-height:1.38;min-height:30cqw;box-shadow:0 1.2cqw 0 #0006;cursor:pointer}
.dlg .name{position:absolute;top:-3.8cqw;left:4cqw;background:var(--rose);color:#fff;font-size:4.2cqw;border-radius:2.4cqw;padding:0 2.8cqw}
.name.bell{background:var(--wine)} .name.me{background:#5b6f8f} .name.ghost{background:#7a5a6a} .name.boxer{background:#4d5b3a} .name.boy{background:#2f6d8c} .name.mgr{background:#222}
.dlg .ctrl{position:absolute;top:-4.4cqw;right:3cqw;display:flex;gap:1.6cqw}
.dlg .ctrl button{font:inherit;font-size:3.6cqw;background:#2b2233;color:var(--paper);border:0;border-radius:2.2cqw;padding:.5cqw 2.4cqw;cursor:pointer}
.dlg .ctrl button.on{background:var(--brass);color:var(--ink)}
.dlg .more{position:absolute;right:4cqw;bottom:2cqw;font-size:3.6cqw;color:var(--muted)}
.dlg .more.bounce{animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-.7cqw)}}
.dlg.sys{background:#1f1828f2;color:var(--paper)}
.dlg.sys .more{color:#b9a9c6}
.dlg.inner{font-style:italic}

/* 혼잣말 말풍선: 저절로 사라지고 다른 곳을 눌러도 돼요 */
.bubble{position:absolute;left:5cqw;right:5cqw;bottom:31cqw;z-index:28;background:#f4e7cdf2;border-radius:4cqw;padding:3.2cqw 4.4cqw;
  font-size:4.8cqw;line-height:1.35;box-shadow:0 1cqw 0 #0006;pointer-events:none;opacity:0;transform:translateY(2cqw);transition:opacity .25s,transform .25s}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;left:8cqw;bottom:-2.4cqw;border:1.4cqw solid transparent;border-top-color:#f4e7cdf2}

/* 큰 버튼 */
.gbtn{font-family:var(--f-hand);font-size:5.2cqw;background:var(--paper);color:var(--ink);border:0;border-radius:3.4cqw;
  padding:1.6cqw 5cqw;box-shadow:0 1cqw 0 #0007;cursor:pointer}
.gbtn:active{transform:translateY(.6cqw);box-shadow:0 .4cqw 0 #0007}
.gbtn.gold{background:var(--brass)}
.gbtn.dark{background:#0009;color:var(--paper);border:1px solid #fff4}
.gbtn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.gbtn:disabled{opacity:.45}
.cta{position:absolute;left:0;right:0;bottom:8cqw;display:flex;flex-direction:column;align-items:center;gap:3cqw;z-index:21}

/* 타이틀 */
.logo{position:absolute;top:13cqw;left:0;right:0;text-align:center;font-family:var(--f-title);color:var(--paper);font-weight:700;
  font-size:10cqw;line-height:1.1;text-shadow:0 0 4cqw #d27a84aa,0 .6cqw 1.2cqw #000}
.logo small{display:block;font-size:3.4cqw;letter-spacing:1.2cqw;color:#f6a3ad;margin-top:2cqw;font-weight:400}
.blink{animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.35}}

/* 로비 규칙 액자 글씨 */
.rules-on-wall{position:absolute;left:59.5%;top:17.5%;width:18.5%;font-size:2.35cqw;line-height:1.35;color:#4a3828;pointer-events:none}
.rules-on-wall b{display:block;text-align:center;font-size:3cqw;margin-bottom:.6cqw}
.red{color:#a33a48}

/* 2층 복도 */
.corr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:20cqw 6cqw 6cqw;gap:3.4cqw;color:var(--paper)}
.corr h2{margin:0;font-family:var(--f-title);font-size:7cqw;text-align:center}
.corr .sub{color:#c9b9d6;font-size:4.4cqw;margin-top:-2cqw;text-align:center}
.door{width:100%;display:flex;align-items:center;gap:3.4cqw;border:0;border-radius:3cqw;padding:3cqw 3.4cqw;cursor:pointer;text-align:left;font-family:inherit;
  background:linear-gradient(90deg,#6b4636,#7c5241 60%,#6b4636);box-shadow:inset 0 0 0 .8cqw #8f5d45,0 1.2cqw 0 #0008;color:var(--paper)}
.door:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.door .plate{flex:none;width:17cqw;height:12cqw;border-radius:2cqw;background:linear-gradient(#f2cf85,#c19050);color:#4a3420;font-family:var(--f-title);font-weight:700;
  font-size:6cqw;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -.6cqw 0 #0003}
.door .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.4cqw}
.door .who{font-size:5cqw}
.door .st{font-size:3.8cqw;color:#f1dcb8}
.door.locked{filter:grayscale(.7) brightness(.6);cursor:not-allowed}
.door.done .st{color:#f6a3ad}
.door .mark{flex:none;width:9cqw;height:9cqw;border-radius:50%}
.door.done .mark{background:radial-gradient(#f2b2b8,#d27a84);border:2px solid #f6a3ad}
.door.open .mark{border:2px dashed var(--brass);animation:blink 1.6s infinite}

/* 모달 */
.modal{position:absolute;inset:0;z-index:40;background:#0b0810d9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;padding:6cqw}
.modal .ttl{color:var(--paper);font-size:5.6cqw;text-align:center}
.modal .row{display:flex;gap:3cqw;flex-wrap:wrap;justify-content:center}
.close{position:absolute;top:4cqw;right:4cqw;font-size:4.4cqw}
.sheet{background:var(--paper);border-radius:3cqw;padding:6cqw 5.4cqw;width:100%;font-size:4.9cqw;line-height:1.5;box-shadow:0 1.4cqw 0 #0007}
.sheet h3{margin:0 0 2cqw;font-family:var(--f-title);font-size:5.4cqw}
.sheet p{margin:0 0 2cqw}
.sheet .sig{text-align:right;color:var(--muted)}
.sheet.news{background:#e9dcc0;font-family:var(--f-title);font-size:4.3cqw}
.sheet.news .hd{font-size:7cqw;font-weight:700;line-height:1.2;margin:1cqw 0 2cqw;border-bottom:2px solid #2b2233;padding-bottom:2cqw}
.sheet.news .meta{font-size:3.4cqw;color:#5a4a3a;display:flex;justify-content:space-between;border-bottom:1px solid #2b2233;padding-bottom:1cqw}
.sheet.tag{background:#fff;border:2px solid #9ab;font-size:4.6cqw}
.sheet.diary{background:#fbf6e6;background-image:repeating-linear-gradient(#fbf6e6 0 7.2cqw,#c9d6e6 7.2cqw 7.4cqw);line-height:7.4cqw;padding-top:4cqw}
.sheet.diary p{margin:0}
.coach{background:var(--paper);border-radius:4cqw;padding:5cqw;width:100%;display:flex;flex-direction:column;gap:3cqw;box-shadow:0 1.4cqw 0 #0007}
.coach h3{margin:0;font-family:var(--f-title);font-size:5.8cqw;text-align:center}
.coach ol{margin:0;padding-left:5cqw;font-size:4.6cqw;line-height:1.45;display:flex;flex-direction:column;gap:1.6cqw}
.coach b{color:var(--wine)}

/* 사진 확대 (201호) */
.photo{position:relative;width:74cqw;aspect-ratio:181/230;border-radius:1.4cqw;box-shadow:0 2cqw 4cqw #000c;
  background-image:url(img/room201.jpg);background-size:397.8% auto;background-position:47.3% 16.2%;transform:rotate(-2deg);transition:transform .5s}
.photo .back{position:absolute;inset:0;background:var(--paper2);border-radius:1.4cqw;padding:9cqw 7cqw;font-size:5.4cqw;line-height:1.5;color:var(--ink);display:flex;flex-direction:column;gap:2cqw}
.photo .back .date{font-size:8cqw;font-weight:700}
.photo .figure{position:absolute;right:6%;bottom:6%;width:22%;opacity:.12;transition:opacity .4s}
.photo.lens .figure{opacity:.85}
.photo .lensring{position:absolute;right:1%;bottom:1%;width:34%;aspect-ratio:1;border-radius:50%;border:1.2cqw solid var(--brass);opacity:0;transition:opacity .3s}
.photo.lens .lensring{opacity:1}

/* 시계 */
.clock{width:72cqw;height:72cqw}
.clock .num{font-family:var(--f-title);font-size:9px;fill:var(--ink);text-anchor:middle}
.readout{color:var(--paper);font-size:6cqw;font-variant-numeric:tabular-nums;text-align:center}

/* 털실 */
.yarn{width:22cqw;height:22cqw;border-radius:50%;border:0;cursor:pointer;box-shadow:inset -2cqw -2cqw 0 #0003,0 1cqw 0 #0006;
  background-image:repeating-linear-gradient(35deg,#fff2 0 1cqw,#0000 1cqw 2.6cqw)}
.yarn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}

/* 연타·타이밍·바람 게이지 */
.bar{position:relative;width:74cqw;height:7cqw;border-radius:99px;background:#0008;border:2px solid var(--paper);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#d84b5a,#f0828c);transition:width .15s}
.bar .zone{position:absolute;top:0;bottom:0;background:#7bd38955;border-left:2px solid #7bd389;border-right:2px solid #7bd389}
.bar .mk{position:absolute;top:-1cqw;bottom:-1cqw;width:2.4cqw;margin-left:-1.2cqw;background:var(--paper);border-radius:1cqw;box-shadow:0 0 2cqw #fff}
.big{font-size:16cqw;line-height:1;cursor:pointer;background:none;border:0;color:var(--paper);touch-action:manipulation}
.dots{display:flex;gap:2cqw}
.dots span{width:6cqw;height:6cqw;border-radius:50%;border:2px solid var(--paper)}
.dots span.on{background:var(--brass);border-color:var(--brass)}
.sky{position:relative;width:60cqw;height:90cqw;border-radius:3cqw;background:linear-gradient(#2d3a6e,#6c5a93 60%,#e99a86);overflow:hidden;border:2px solid var(--paper)}
.sky .band{position:absolute;left:0;right:0;background:#7bd38933;border-top:2px dashed #7bd389;border-bottom:2px dashed #7bd389}
.sky .kite{position:absolute;left:50%;width:14cqw;margin-left:-7cqw;transition:top .08s linear}
.sky .string{position:absolute;left:50%;bottom:0;width:2px;background:#f4e7cd99;transform-origin:bottom}

/* 자물쇠 */
.keypad{display:grid;grid-template-columns:repeat(3,18cqw);gap:2.4cqw}
.keypad button{font-family:var(--f-title);font-size:6cqw;height:14cqw;border:0;border-radius:3cqw;background:#cfd3d6;color:#2b2233;box-shadow:0 1cqw 0 #0007;cursor:pointer}
.lockshow{font-family:var(--f-title);font-size:10cqw;letter-spacing:3cqw;color:var(--paper);font-variant-numeric:tabular-nums;background:#0008;border-radius:3cqw;padding:1cqw 4cqw 1cqw 7cqw}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-2cqw)}40%,80%{transform:translateX(2cqw)}}
.cbtn{width:20cqw;height:20cqw;border-radius:50%;border:.8cqw solid #2b2233;cursor:pointer;box-shadow:0 1.2cqw 0 #0008}
.cbtn:active{transform:translateY(.8cqw);box-shadow:0 .4cqw 0 #0008}

/* 조각 사진 퍼즐 */
.puzzle{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw;width:78cqw;aspect-ratio:1;background:#6b4636;padding:1.4cqw;border-radius:2cqw}
.tile{border:0;padding:0;border-radius:1cqw;background-size:300% 300%;cursor:pointer;outline-offset:-1cqw}
.tile.sel{outline:1cqw solid var(--brass)}
.puzzle.solved{gap:0;padding:1.4cqw}
.puzzle.solved .tile{border-radius:0}

/* 체크아웃·기억 */
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#fff8e6 0%,#ffd98fcc 25%,#e3ab5c55 50%,#0000 75%);opacity:0;transition:opacity 1.6s;pointer-events:none;z-index:15}
.glow.on{opacity:1}
.memory{position:absolute;inset:0;z-index:42;background:radial-gradient(ellipse at 50% 40%,#5a4330,#22180f 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;padding:8cqw;color:#f6e6c8;text-align:center}
.memory .lab{font-size:4cqw;letter-spacing:.6cqw;color:#e3ab5c}
.memory h2{margin:0;font-family:var(--f-title);font-size:7cqw}
.memory p{margin:0;font-size:5.2cqw;line-height:1.55;font-style:italic}
.memory .grain{position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 30%,#fff1 0 1px,#0000 1px 3px);opacity:.25;pointer-events:none}
.card{background:var(--paper);border-radius:4cqw;padding:5cqw;width:82cqw;text-align:center;box-shadow:0 1.4cqw 0 #0007;display:flex;flex-direction:column;gap:2.4cqw;color:var(--ink)}
.card h2{margin:0;font-family:var(--f-title);font-size:6.4cqw}
.card .sub{color:var(--muted);font-size:4.4cqw}
.stamps{display:flex;gap:2.2cqw;justify-content:center}
.stamp{width:10cqw;height:10cqw;border-radius:50%;border:2px dashed #b8a58a}
.stamp.done{border:2px solid var(--rose);background:radial-gradient(#f2b2b8,#d27a84)}
.stamp.new{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(2.6) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.guest{font-size:4.6cqw}
.guest b{color:var(--wine)}
.toast{position:absolute;left:50%;top:15cqw;transform:translateX(-50%);z-index:45;background:#000c;color:var(--paper);padding:1.6cqw 4cqw;
  border-radius:3cqw;font-size:4.4cqw;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wrap"><div class="stage" id="stage">

  <img class="bg" id="bg" src="img/title.jpg" alt="">
  <div class="scene" id="scene"></div>
  <div class="glow" id="glow"></div>

  <div class="hud" id="hud" hidden>
    <span class="pill" id="where">1F 로비</span>
    <span style="display:flex;gap:2cqw">
      <span class="pill" id="stampPill">도장 0/5</span>
      <button class="hbtn" id="muteBtn">소리 켬</button>
    </span>
  </div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const scene=$("scene"), bg=$("bg");
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= 소리 ================= */
let ac=null, muted=false;
function tone(freq,dur,type,vol,delay){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.12,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx={
  tap:()=>tone(660,.07,"triangle",.05),
  item:()=>{tone(784,.12,"triangle",.1);tone(1047,.18,"triangle",.1,.1);},
  wrong:()=>tone(200,.2,"square",.04),
  ding:()=>{tone(1568,1.2,"sine",.12);tone(2350,.9,"sine",.05);},
  click:()=>{tone(1200,.04,"square",.05);tone(800,.05,"square",.05,.05);},
  solve:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.35,"triangle",.09,i*.11));},
  knit:()=>tone(900+Math.random()*300,.05,"triangle",.05),
  punch:()=>{tone(90,.25,"sine",.3);tone(140,.08,"square",.06);},
  miss:()=>tone(300,.12,"sawtooth",.03),
  wind:()=>tone(500+Math.random()*200,.25,"sine",.03),
  memory:()=>{[392,494,587,784].forEach((f,i)=>tone(f,.9,"sine",.06,i*.28));}
};
$("muteBtn").addEventListener("click",()=>{muted=!muted;$("muteBtn").textContent=muted?"소리 끔":"소리 켬";});

/* ================= 상태·저장 ================= */
const FRESH=()=>({intro:false,stamps:0,inv:[],frags:[],taps:0,coach:false,briefed:{},
  r201:{}, r202:{}, r203:{}});
let S=FRESH();
const KEY="hotel-last-checkout-v2";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(ROOM&&typeof ROOMS!=="undefined"&&ROOMS[ROOM])ROOMS[ROOM].goal();}

let ROOM=null; // 지금 있는 방 id

/* ================= 대사 ================= */
const dlg=$("dlg"), tapL=$("taplayer");

let queue=[], onDone=null, busy=false, typing=null, full="", autoT=null, auto=false;
function say(lines,done){queue=lines.slice();onDone=done||null;busy=true;tapL.hidden=false;hideBubble();next();}
function next(){
  clearTimeout(autoT); clearInterval(typing); typing=null;
  if(!queue.length){dlg.hidden=true;tapL.hidden=true;busy=false;const d=onDone;onDone=null;if(d)d();return;}
  const [who,text]=queue.shift();
  const nm=$("dlgName"); nm.textContent=NAMES[who]||""; nm.className="name "+who; nm.hidden=!NAMES[who];
  dlg.className="dlg"+(who==="sys"?" sys":"")+(who==="me"&&text.startsWith("(")?" inner":"");
  dlg.hidden=false; full=text;
  const more=$("dlgMore"); more.textContent=S.taps<4?"화면 아무 곳이나 누르면 다음 ▶":"▶"; more.classList.toggle("bounce",S.taps<4); more.style.visibility="hidden";
  if(RM){$("dlgText").textContent=full;lineDone();return;}
  let i=0; $("dlgText").textContent="";
  typing=setInterval(()=>{i+=1;$("dlgText").textContent=full.slice(0,i);if(i>=full.length){clearInterval(typing);typing=null;lineDone();}},24);
}
function lineDone(){$("dlgMore").style.visibility="visible";if(auto)autoT=setTimeout(next,1100+full.length*45);}
function advance(){
  if(typing){clearInterval(typing);typing=null;$("dlgText").textContent=full;lineDone();return;}

}

function hot(x,y,w,h,label,fn,sparkle){

            say([["sys","딸깍! 상자 뚜껑이 열렸다. 리본으로 묶은 새 연줄이 들어 있다."],["me","(민호한테 주려던 생일 선물. 이걸로 연을 고칠 수 있겠어.)"]],()=>ping("찢어진 연"));},500);}
          else{sfx.wrong();sq.classList.remove("shake");void sq.offsetWidth;sq.classList.add("shake");setTimeout(()=>{seq=[];sq.textContent=R.diary?"아니야. 처음 같이 날린 연 색깔, 위에서부터…":"단서가 필요해.";},350);}
        }});cb.appendChild(b);});
  });
}
function kite(){
  const R=S.r203;
  if(R.kite){peek("연은 이미 고쳐서 챙겼다.");return;}
  if(!has("새 연줄")){peek("부러진 연. 연살이 꺾이고 줄이 끊어졌다. 줄이 있으면 고칠 수 있을 것 같다.");return;}
  mash({title:"새 연줄로 연살을 동여매자!",icon:"🪁",label:"빠르게 연타해서 단단히 감자!",sound:sfx.knit},()=>{
    R.kite=true; take("새 연줄"); give("고친 연"); save();
    say([["sys","꺾인 연살을 새 연줄로 꽁꽁 동여맸다. 연이 다시 팽팽해졌다."],["me","(사과 쪽지를 연에 매달아서… 민호가 있는 쪽으로 날려 보내자.)"]],()=>{VIEW.insertAdjacentHTML("beforeend",'<span class="sparkle" data-for="창문" style="left:86%;top:22%"></span>');ping("창문");});
  });
}
function openWindow(){
  const R=S.r203;
  if(!has("고친 연")){peek("빗방울 너머로 커다란 나무가 보인다. 바람이 세다.");return;}
  if(!has("사과 쪽지")){peek("연에 매달 쪽지가 있으면 좋을 텐데.");return;}
  fly(()=>{
    take("고친 연"); take("사과 쪽지");
    say([["sys","쪽지를 매단 연이 비구름을 뚫고 높이, 더 높이 올라갔다. 그리고 실이 손끝에서 스르르 풀려 나갔다."]],()=>checkout(203,[
      ["boy","와… 진짜 날아갔다! 민호한테 꼭 닿을 거예요."],
      ["boy","어? 아저씨! 그때 나무에 걸린 내 연 꺼내 준 아저씨죠? 강아지는요? 방울 달린 하얀 강아지!"],
      ["sys","준호는 대답을 기다리지 않고, 웃으며 빛 속으로 뛰어나갔다."]
    ],()=>go(lobbyFinale)));
  });
}

/* ================= 미니게임 ================= */
function mash(o,done){
  let p=0, fin=false;
  modal('<div class="ttl">'+o.title+'</div><button class="big" id="nd" aria-label="연타">'+o.icon+'</button><div class="bar"><i id="kb"></i></div><div class="readout" style="font-size:4.6cqw">'+o.label+'</div>',m=>{
    const kb=m.querySelector("#kb"), nd=m.querySelector("#nd");
    const decay=setInterval(()=>{if(!fin&&p>0){p=Math.max(0,p-2);kb.style.width=p+"%";}},120);
    m._cleanup=()=>clearInterval(decay);
    nd.addEventListener("click",()=>{
      if(fin)return; p=Math.min(100,p+9); kb.style.width=p+"%"; o.sound();
      nd.style.transform="rotate("+(Math.random()<.5?-12:12)+"deg) scale(1.08)"; setTimeout(()=>nd.style.transform="",80);
      if(p>=100){fin=true;sfx.solve();setTimeout(()=>{closeModal();done();},600);}
    });
  });
}
function timing(o,done){
  let pos=0, dir=1, hits=0, fin=false, raf, last=performance.now(), speed=60;
  modal('<div class="ttl">'+o.title+'</div><div class="dots" id="dt">'+'<span></span>'.repeat(o.need)+'</div>'+
    '<div class="bar" id="tb"><span class="zone" style="left:42%;width:16%"></span><span class="mk" id="mk"></span></div>'+
    '<button class="gbtn gold" id="pb" style="font-size:7cqw;padding:2cqw 10cqw">펀치!</button><div class="readout" style="font-size:4.4cqw" id="tl">'+o.label+'</div>',m=>{
    const mk=m.querySelector("#mk"), dots=m.querySelectorAll("#dt span"), tl=m.querySelector("#tl");
    const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;pos+=dir*speed*dt;if(pos>100){pos=100;dir=-1;}if(pos<0){pos=0;dir=1;}mk.style.left=pos+"%";raf=requestAnimationFrame(loop);};
    raf=requestAnimationFrame(loop); m._cleanup=()=>cancelAnimationFrame(raf);
    m.querySelector("#pb").addEventListener("click",()=>{
      if(fin)return;
      if(pos>=41&&pos<=59){hits++;sfx.punch();dots[hits-1].classList.add("on");speed+=22;tl.textContent=["좋아!","한 번 더!","됐다!"][Math.min(hits-1,2)];
        m.querySelector("#tb").classList.remove("shake");void m.offsetWidth;m.querySelector("#tb").classList.add("shake");
        if(hits>=o.need){fin=true;sfx.solve();setTimeout(()=>{closeModal();done();},700);}}
      else{sfx.miss();tl.textContent="빗나갔다! 초록 칸에서 눌러!";}
    });
  });
}
function fly(done){
  let y=70, v=0, held=0, fin=false, raf, last=performance.now(), gust=0;
  modal('<div class="ttl">바람을 타고 연을 띄우자!</div><div class="sky" id="sky"><div class="band" style="top:18%;height:22%"></div><div class="string" id="str"></div>'+
    '<svg class="kite" id="kt" viewBox="0 0 40 60"><path d="M20 0L40 22 20 50 0 22Z" fill="#e8c14e"/><path d="M20 0L40 22H0Z" fill="#d84b5a"/><path d="M20 0V50M0 22H40" stroke="#6b4636" stroke-width="1.5"/><rect x="24" y="30" width="10" height="8" fill="#fbf6e6" stroke="#999" stroke-width=".8"/></svg></div>'+
    '<div class="bar" style="height:4cqw"><i id="fb"></i></div><button class="gbtn gold" id="pull" style="font-size:6.4cqw;padding:2cqw 9cqw">줄 당기기</button>'+
    '<div class="readout" style="font-size:4.2cqw">초록 띠 안에 연을 머무르게 해요</div>',m=>{
    const kt=m.querySelector("#kt"), fb=m.querySelector("#fb"), str=m.querySelector("#str");
    const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;
      gust+=dt; const wind=Math.sin(gust*1.7)*14+Math.sin(gust*4.3)*6;
      v+=(35+wind)*dt; v*=(1-1.8*dt); y=Math.max(2,Math.min(88,y+v*dt));
      kt.style.top=y+"%";
      const inBand=y>=16&&y<=38; if(inBand&&!fin){held+=dt;}else if(!fin){held=Math.max(0,held-dt*.5);}
      fb.style.width=Math.min(100,held/3.2*100)+"%";
      str.style.height=(100-y)+"%";
      if(held>=3.2&&!fin){fin=true;sfx.solve();kt.style.transition="top 1.4s ease-in";kt.style.top="-30%";setTimeout(()=>{closeModal();done();},1400);}
      if(!fin)raf=requestAnimationFrame(loop);};
    raf=requestAnimationFrame(loop); m._cleanup=()=>cancelAnimationFrame(raf);
    m.querySelector("#pull").addEventListener("click",()=>{if(fin)return;v-=20;sfx.wind();});
  });
}

/* ================= 2층을 마치고 로비로 ================= */
function lobbyFinale(){
  $("glow").classList.remove("on"); lobbyBase();
  const end=()=>modal('<div class="card"><h2>데모 끝 · 2층 클리어</h2><div class="sub">기억 조각 '+S.frags.length+' / 5</div>'+stampsHtml(-1)+
      '<div class="guest">3층 <b>지키지 못한 약속</b>의 손님들이 기다리고 있어요. 다음 업데이트에서 만나요.</div>'+
      '<div class="row"><button class="gbtn gold" id="again">처음부터</button><button class="gbtn dark" id="spoil" style="color:var(--ink);background:#0000;border-color:#0003">엔딩 미리보기</button></div></div>',m=>{
      m.querySelector("#again").addEventListener("click",()=>{sfx.tap();wipe();S=FRESH();closeModal();go(title);});
      m.querySelector("#spoil").addEventListener("click",()=>{sfx.tap();closeModal();go(ending);});
    });
  if(S.finaleSeen){end();return;}
  say([
    ["bell","2층 손님 세 분이 모두 체크아웃하셨어요! 도장이 세 개나 모였네요!"],
    ["sys","그 순간, 번호 없는 열쇠가 따뜻해졌다. 지워진 자리에 숫자 하나가 희미하게 떠오른다. '1'… 그리고 그 옆에 '3'."],
    ["me","13…? 13층은 없다고 했잖아."],
    ["bell","(꼬리가 축 처진다) …그건, 아직 아니에요. 아직은요."],
    ["mgr","13층은 존재하지 않습니다. 손님은 여기 계속 머무르시면 됩니다. 영원히."],
    ["me","(돌아온 기억 세 조각. 전부 강아지가 있었어. 방울 단 하얀 강아지. 그리고 나는… '다음에 길게 걷자'고 했어.)"],
    ["me","벨. 너, 나 알지?"],
    ["bell","…3층이 열리면 또 뵐게요, 손님. 그때는 제가 더 많이 말씀드릴게요."]
  ],()=>{S.finaleSeen=true;save();end();});
}
function ending(){
  ROOM=null; setFull("img/ending.jpg"); $("hud").hidden=true; roomUI(false);
  say([["sys","…그리고 아주 먼 훗날, 13층 마지막 방을 나선 뒤."],["bell","이번엔… 끝까지 같이 걸어 줄 거죠?"],["me","응. 이번엔 끝까지."],["sys","마지막 산책 · 계속"]],()=>{
    const c=document.createElement("div");c.className="cta";c.innerHTML='<button class="gbtn">타이틀로</button>';
    c.querySelector("button").addEventListener("click",()=>{sfx.tap();go(title);});scene.appendChild(c);
  });
}

["lobby","room201","room202","room203","ending"].forEach(n=>{const i=new Image();i.src="img/"+n+".jpg";});
title();
