<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>호텔 라스트 체크아웃</title>
<meta name="description" content="마음에 짐이 남은 사람들이 머무는 호텔. 방마다 숨은 미련을 풀어 손님을 체크아웃시키는 방탈출 게임.">
<meta name="theme-color" content="#17131f">
<meta property="og:type" content="website">
<meta property="og:title" content="호텔 라스트 체크아웃">
<meta property="og:description" content="체크아웃은 언제든 가능합니다. 마음의 짐만 내려놓으신다면.">
<meta property="og:image" content="https://ykooon0830-source.github.io/mung-walk/hotel/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 세로 화면 방탈출: 9:16 판 하나가 화면 가운데에 놓이고, 그림 위에 투명한 조사 지점과 대사창·소지품 칸을 겹쳐요. */
:root{
  --bg:#17131f; --paper:#f4e7cd; --paper2:#efe0c2; --ink:#2b2233; --muted:#8a7a6a;
  --brass:#e3ab5c; --rose:#d27a84; --wine:#8c2f3a;
  --f-hand:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-title:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.stage{position:relative;width:min(100%, calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16));
  aspect-ratio:9/16;overflow:hidden;container-type:inline-size;background:#000;font-family:var(--f-hand);color:var(--ink)}
@media (min-width:600px){.stage{border-radius:18px;box-shadow:0 20px 60px #000a}}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s}
.scene{position:absolute;inset:0}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:50}
.fade.on{opacity:1}

/* 조사 지점 */
.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:12px}
.hot:focus-visible{outline:3px solid var(--brass)}
.hot.ping::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 0 2px #fff8 inset,0 0 18px #ffd98f;animation:ping 1.4s ease-out 2 forwards}
@keyframes ping{from{opacity:1}to{opacity:0}}
.sparkle{position:absolute;width:3cqw;height:3cqw;margin:-1.5cqw;border-radius:50%;background:radial-gradient(#fff,#ffd98f 40%,transparent 70%);
  pointer-events:none;animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:2cqw;
  padding:3cqw 3.4cqw;z-index:20;background:linear-gradient(#000a,#0000);font-size:4.2cqw;color:var(--paper)}
.pill{background:#0008;border:1px solid #fff3;border-radius:99px;padding:.4cqw 3cqw;white-space:nowrap}
.hbtn{font:inherit;color:var(--paper);background:#0008;border:1px solid #fff3;border-radius:99px;padding:.4cqw 3cqw;cursor:pointer}
.hbtn:focus-visible{outline:2px solid var(--brass)}

/* 대사창 */
.dlg{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;z-index:30;background:var(--paper);border-radius:4cqw;
  padding:5cqw 4.4cqw 3.6cqw;font-size:5.1cqw;line-height:1.35;min-height:22cqw;box-shadow:0 1.2cqw 0 #0006;cursor:pointer}
.dlg .name{position:absolute;top:-3.6cqw;left:4cqw;background:var(--rose);color:#fff;font-size:4.2cqw;border-radius:2.4cqw;padding:0 2.8cqw}
.dlg .name.bell{background:var(--wine)}
.dlg .name.me{background:#5b6f8f}
.dlg .name.ghost{background:#7a5a6a}
.dlg .more{position:absolute;right:4cqw;bottom:1.6cqw;font-size:3.4cqw;color:var(--muted);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-.6cqw)}}

/* 소지품 */
.inv{position:absolute;left:3cqw;bottom:31cqw;z-index:25;display:flex;gap:1.6cqw}
.slot{width:14cqw;height:14cqw;border-radius:3cqw;background:#0009;border:1px dashed #fff5;display:flex;align-items:center;justify-content:center;
  color:var(--paper);font-size:3.2cqw;text-align:center;line-height:1.05;padding:.6cqw}
.slot.got{border:2px solid var(--brass);background:#3a2a1ccc;animation:got .5s ease-out}
@keyframes got{from{transform:scale(1.5)}}
.slot svg{width:8cqw;height:8cqw}

/* 큰 버튼 */
.gbtn{font-family:var(--f-hand);font-size:5.2cqw;background:var(--paper);color:var(--ink);border:0;border-radius:3.4cqw;
  padding:1.6cqw 5cqw;box-shadow:0 1cqw 0 #0007;cursor:pointer}
.gbtn:active{transform:translateY(.6cqw);box-shadow:0 .4cqw 0 #0007}
.gbtn.gold{background:var(--brass)}
.gbtn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.gbtn.ghostbtn{background:#0008;color:var(--paper);border:1px solid #fff4}

/* 타이틀 */
.logo{position:absolute;top:13cqw;left:0;right:0;text-align:center;font-family:var(--f-title);color:var(--paper);font-weight:700;
  font-size:10cqw;line-height:1.1;text-shadow:0 0 4cqw #d27a84aa,0 .6cqw 1.2cqw #000}
.logo small{display:block;font-size:3.4cqw;letter-spacing:1.2cqw;color:#f6a3ad;margin-top:2cqw;font-weight:400}
.tapgo{position:absolute;bottom:9cqw;left:0;right:0;text-align:center;color:var(--paper);font-size:5.6cqw;text-shadow:0 .4cqw 1cqw #000;animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.25}}

/* 로비 규칙 액자 글씨 */
.rules-on-wall{position:absolute;left:59.5%;top:17.5%;width:18.5%;font-size:2.35cqw;line-height:1.35;color:#4a3828;pointer-events:none;text-align:left}
.rules-on-wall b{display:block;text-align:center;font-size:3cqw;margin-bottom:.6cqw}
.rules-on-wall .red{color:#a33a48}

/* 모달 */
.modal{position:absolute;inset:0;z-index:40;background:#0b0810cc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;padding:6cqw}
.modal .ttl{color:var(--paper);font-size:5.4cqw}
.modal .row{display:flex;gap:3cqw;flex-wrap:wrap;justify-content:center}
.close{position:absolute;top:4cqw;right:4cqw;font-size:4.4cqw}
.sheet{background:var(--paper);border-radius:3cqw;padding:6cqw 5.4cqw;width:100%;font-size:5cqw;line-height:1.5;box-shadow:0 1.4cqw 0 #0007}
.sheet h3{margin:0 0 2cqw;font-family:var(--f-title);font-size:5.4cqw}
.sheet p{margin:0 0 2cqw}
.sheet .red{color:#a33a48}
.sheet .sig{text-align:right;color:var(--muted)}

/* 사진 확대 */
.photo{position:relative;width:74cqw;aspect-ratio:181/230;border-radius:1.4cqw;box-shadow:0 2cqw 4cqw #000c;
  background-image:url(img/room201.jpg);background-size:397.8% auto;background-position:47.3% 16.2%;transform:rotate(-2deg);transition:transform .5s}
.photo .back{position:absolute;inset:0;background:var(--paper2);border-radius:1.4cqw;padding:9cqw 7cqw;font-size:5.4cqw;line-height:1.5;color:var(--ink);
  display:flex;flex-direction:column;gap:2cqw}
.photo .back .date{font-size:8cqw;font-weight:700}
.photo .figure{position:absolute;right:6%;bottom:6%;width:22%;opacity:.12;transition:opacity .4s}
.photo.lens .figure{opacity:.85}
.photo .lensring{position:absolute;right:1%;bottom:1%;width:34%;aspect-ratio:1;border-radius:50%;border:1.2cqw solid var(--brass);opacity:0;transition:opacity .3s}
.photo.lens .lensring{opacity:1}

/* 시계 퍼즐 */
.clock{width:72cqw;height:72cqw}
.clock .num{font-family:var(--f-title);font-size:9px;fill:var(--ink);text-anchor:middle}
.readout{color:var(--paper);font-size:6cqw;font-variant-numeric:tabular-nums}

/* 털실 */
.yarn{width:22cqw;height:22cqw;border-radius:50%;border:0;cursor:pointer;box-shadow:inset -2cqw -2cqw 0 #0003,0 1cqw 0 #0006;
  background-image:repeating-linear-gradient(35deg,#fff2 0 1cqw,#0000 1cqw 2.6cqw)}
.yarn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}

/* 뜨개질 */
.knitbar{width:70cqw;height:5cqw;border-radius:99px;background:#0008;border:2px solid var(--paper);overflow:hidden}
.knitbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d84b5a,#f0828c);transition:width .15s}
.needle{font-size:16cqw;line-height:1;cursor:pointer;background:none;border:0;color:var(--paper);touch-action:manipulation}

/* 체크아웃 */
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#fff8e6 0%,#ffd98fcc 25%,#e3ab5c55 50%,#0000 75%);opacity:0;transition:opacity 1.6s;pointer-events:none}
.glow.on{opacity:1}
.card{background:var(--paper);border-radius:4cqw;padding:5cqw;width:80cqw;text-align:center;box-shadow:0 1.4cqw 0 #0007;display:flex;flex-direction:column;gap:2cqw}
.card h2{margin:0;font-family:var(--f-title);font-size:6.4cqw}
.card .sub{color:var(--muted);font-size:4.4cqw}
.stamps{display:flex;gap:2.2cqw;justify-content:center}
.stamp{width:10cqw;height:10cqw;border-radius:50%;border:2px dashed #b8a58a}
.stamp.done{border:2px solid var(--rose);background:radial-gradient(#f2b2b8,#d27a84);animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(2.6) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.guest{font-size:4.6cqw}
.guest b{color:var(--wine)}
.toast{position:absolute;left:50%;top:16cqw;transform:translateX(-50%);z-index:45;background:#000c;color:var(--paper);padding:1.6cqw 4cqw;
  border-radius:3cqw;font-size:4.4cqw;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wrap"><div class="stage" id="stage">

  <img class="bg" id="bg" src="img/title.jpg" alt="">
  <div class="scene" id="scene"></div>
  <div class="glow" id="glow"></div>

  <div class="hud" id="hud" hidden>
    <span class="pill" id="where">1F 로비</span>
    <span style="display:flex;gap:2cqw">
      <button class="hbtn" id="hintBtn" hidden>힌트</button>
      <button class="hbtn" id="muteBtn" aria-label="소리 끄기">소리 켬</button>
    </span>
  </div>

  <div class="inv" id="inv" hidden></div>

  <div class="dlg" id="dlg" role="button" tabindex="0" hidden>
    <span class="name" id="dlgName">벨</span><span id="dlgText"></span><span class="more" id="dlgMore">▼</span>
  </div>

  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast"></div>
  <div class="fade" id="fade"></div>
</div></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const stage=$("stage"), scene=$("scene"), bg=$("bg");

/* ---------- 소리 ---------- */
let ac=null, muted=false;
function tone(freq,dur,type,vol,delay){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.12,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx={
  tap:()=>tone(660,.08,"triangle",.06),
  item:()=>{tone(784,.12,"triangle",.1);tone(1047,.18,"triangle",.1,.1);},
  wrong:()=>{tone(220,.18,"square",.04);},
  ding:()=>{tone(1568,1.2,"sine",.12);tone(2350,.9,"sine",.05);},
  click:()=>{tone(1200,.04,"square",.05);tone(800,.05,"square",.05,.05);},
  solve:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.35,"triangle",.09,i*.11));},
  knit:()=>tone(900+Math.random()*300,.05,"triangle",.05)
};
$("muteBtn").addEventListener("click",()=>{muted=!muted;$("muteBtn").textContent=muted?"소리 끔":"소리 켬";});

/* ---------- 상태 ---------- */
const S={inv:[], seenPhoto:false, clue:false, drawerOpen:false, letter:false, redYarn:false, sweater:false, stamps:0, sawFigure:false};

/* ---------- 대사 ---------- */
const dlg=$("dlg");
let queue=[], onDone=null, busy=false;
const NAMES={bell:["벨","bell"],me:["나","me"],ghost:["할머니","ghost"],sys:["",""],mgr:["지배인","bell"]};
function say(lines,done){
  queue=lines.slice(); onDone=done||null; busy=true; next();
}
function next(){
  if(!queue.length){dlg.hidden=true;busy=false;const d=onDone;onDone=null;if(d)d();return;}
  const [who,text]=queue.shift(), n=NAMES[who]||NAMES.me;
  $("dlgName").textContent=n[0]; $("dlgName").className="name "+n[1]; $("dlgName").hidden=!n[0];
  $("dlgText").textContent=text; dlg.hidden=false;
}
dlg.addEventListener("click",()=>{sfx.tap();next();});
dlg.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();next();}});
function line(who,text){say([[who,text]]);}

/* ---------- 도우미 ---------- */
let toastT;
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1800);}
function go(fn){const f=$("fade");f.classList.add("on");setTimeout(()=>{fn();f.classList.remove("on");},460);}
function hot(x,y,w,h,label,fn,opts){
  const b=document.createElement("button");b.className="hot";b.setAttribute("aria-label",label);
  Object.assign(b.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"});
  b.addEventListener("click",e=>{e.stopPropagation();if(busy||!$("modal").hidden)return;sfx.tap();fn(b);});
  scene.appendChild(b);
  if(opts&&opts.sparkle){const s=document.createElement("span");s.className="sparkle";s.style.left=(x+w*opts.sparkle[0])+"%";s.style.top=(y+h*opts.sparkle[1])+"%";s.style.animationDelay=(Math.random()*2)+"s";scene.appendChild(s);}
  return b;
}
const ICONS={
  "사진":'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1" fill="#c19050"/><rect x="5" y="6" width="14" height="12" fill="#a9cdd3"/><circle cx="10" cy="12" r="2.4" fill="#ecca9c"/><circle cx="15" cy="13" r="2" fill="#ecca9c"/></svg>',
  "편지":'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="1" fill="#f4e7cd"/><path d="M3 7l9 6 9-6" fill="none" stroke="#8a7a6a" stroke-width="1.5"/></svg>',
  "빨간 실":'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#d84b5a"/><path d="M6 9q6 3 12 0M5 13q7 3 14 0" stroke="#f0828c" fill="none"/></svg>',
  "스웨터":'<svg viewBox="0 0 24 24"><path d="M7 4h10l4 5-3 2v9H6v-9L3 9z" fill="#d84b5a"/><path d="M10 4q2 2 4 0" stroke="#8c2f3a" fill="none"/></svg>'
};
function give(name){
  if(S.inv.includes(name))return;
  S.inv.push(name); sfx.item(); renderInv(true); toast(name+" 획득!");
}
function take(name){S.inv=S.inv.filter(n=>n!==name);renderInv();}
function renderInv(fresh){
  const inv=$("inv"); inv.innerHTML="";
  for(let i=0;i<4;i++){
    const d=document.createElement("div"), n=S.inv[i];
    d.className="slot"+(n?" got":""); if(!fresh||i!==S.inv.length-1)d.style.animation="none";
    d.innerHTML=n?(ICONS[n]||"")+"<span>"+n+"</span>":"";
    if(n){d.style.flexDirection="column";}
    inv.appendChild(d);
  }
}
function modal(html,onOpen){
  const m=$("modal"); m.innerHTML=html; m.hidden=false;
  const c=m.querySelector(".close"); if(c)c.addEventListener("click",()=>{sfx.tap();closeModal();});
  if(onOpen)onOpen(m);
}
function closeModal(){$("modal").hidden=true;$("modal").innerHTML="";}

/* ---------- 1. 타이틀 ---------- */
function title(){
  bg.src="img/title.jpg"; scene.innerHTML=""; $("hud").hidden=true; $("inv").hidden=true; dlg.hidden=true; $("glow").classList.remove("on");
  scene.innerHTML='<div class="logo">호텔<br>라스트 체크아웃<small>HOTEL LAST CHECKOUT</small></div><div class="tapgo">화면을 눌러 체크인</div>';
  scene.onclick=()=>{scene.onclick=null;sfx.ding();go(lobbyIntro);};
}

/* ---------- 2. 로비 ---------- */
function lobbyBase(){
  bg.src="img/lobby.jpg"; scene.innerHTML=""; scene.onclick=null;
  $("hud").hidden=false; $("where").textContent="1F 로비"; $("hintBtn").hidden=true; $("inv").hidden=true;
  scene.insertAdjacentHTML("beforeend",
    '<div class="rules-on-wall"><b>호텔 규칙</b>1. 체크아웃 시간은 없음<br>2. 남의 짐 열지 말 것<br>3. 시계를 믿지 말 것<br><span class="red">4. 13층은 없습니다</span><br>5. 지배인을 찾지 말 것</div>');
  hot(17,24,66,39,"벨",()=>line("bell",["손님 방은 아직 청소 중이에요. 조금만 기다려 주세요!","제 꼬리요? 손님 오시면 원래 이렇게 돼요.","…아, 아니에요. 그냥 반가워서요."][Math.floor(Math.random()*3)]));
  hot(0,14,36,25,"열쇠 걸이",()=>line("me","방 열쇠들이 걸려 있다. 빈 고리 하나에는 번호가 지워져 있다."));
  hot(57,14,23,20,"호텔 규칙 액자",showRules);
  hot(80,4,20,49,"괘종시계",()=>line("me","괘종시계 바늘이 움직이지 않는다. 여기서는 시간이 흐르지 않는 걸까?"));
  hot(70,55,22,9,"호출 벨",()=>{sfx.ding();line("bell","부르셨어요? 헤헤, 저 벨이라서 이 소리 좋아해요!");});
  hot(0,45,16,20,"꽃병",()=>line("me","하얀 수국이다. 시들지 않는 꽃 같다."));
}
function showRules(){
  modal('<button class="gbtn ghostbtn close">닫기</button><div class="sheet"><h3>호텔 규칙</h3>'+
    '<p>1. 체크아웃 시간은 정해져 있지 않습니다.</p><p>2. 다른 손님의 짐을 함부로 열지 마십시오.</p><p>3. 시계를 믿지 마십시오.</p>'+
    '<p class="red">4. 13층은 존재하지 않습니다.</p><p>5. 지배인을 찾지 마십시오.</p><p class="sig">— 지배인 백</p></div>');
}
function lobbyIntro(){
  lobbyBase();
  say([
    ["sys","…눈을 떠 보니, 낯선 호텔 로비였다. 손에는 번호가 지워진 열쇠가 쥐어져 있다."],
    ["bell","어서 오세요, 손님! 오래… 아니, 처음 뵙겠습니다!"],
    ["bell","저는 이 호텔 컨시어지 벨이에요. 여기는 마음에 짐이 남은 사람들이 머무는 곳이에요."],
    ["me","나는… 왜 여기 있는 거지? 아무것도 기억이 안 나."],
    ["bell","손님 방은 아직 준비가 안 됐어요. 그동안 다른 손님들을 좀 도와주실래요?"],
    ["bell","201호 할머니가 아주 오래 체크아웃을 못 하고 계세요. 방을 잘 살펴보면 방법이 보일 거예요."],
    ["bell","아, 벽에 걸린 규칙은 꼭 지켜주세요. 특히… 4번이요."]
  ],()=>{
    toast("로비를 둘러보거나 201호로 가보세요");
    const g=document.createElement("div");g.style.cssText="position:absolute;left:0;right:0;bottom:6cqw;display:flex;justify-content:center;z-index:22";
    g.innerHTML='<button class="gbtn gold">201호로 가기</button>';
    g.querySelector("button").addEventListener("click",e=>{e.stopPropagation();if(busy)return;sfx.ding();go(room);});
    scene.appendChild(g);
  });
}

/* ---------- 3. 201호 ---------- */
function room(){
  bg.src="img/room201.jpg"; scene.innerHTML=""; $("where").textContent="201호 · 하지 못한 말";
  $("hintBtn").hidden=false; $("inv").hidden=false; renderInv();
  hot(0,6,24,30,"창문",()=>line("me","밖에는 비가 내린다. 이 호텔에는 늘 밤만 있는 것 같다."));
  hot(35.5,13,25,18.5,"사진 액자",openPhoto,{sparkle:[.85,.15]});
  hot(62.5,4,36,21,"벽시계",openClock,{sparkle:[.5,.5]});
  hot(73,29,21,10,"스탠드",()=>line("me","따뜻한 불빛이다. 누군가를 기다리며 켜둔 불 같다."));
  hot(87,37,13,14,"라벤더 꽃병",()=>line("me","라벤더 향이 난다. 할머니가 좋아하던 꽃일까."));
  hot(22,46,44,26,"뜨개질하던 스웨터",sweater,{sparkle:[.75,.6]});
  hot(70,52.5,16,4.5,"편지 봉투",envelope);
  hot(76,56.6,21,4,"협탁 서랍",drawer);
  hot(67,66.5,31,16,"털실 바구니",openYarn,{sparkle:[.4,.3]});
  hot(10,86,80,13,"러그",()=>line("me","동그랗게 땋은 러그. 빨간 실 한 가닥이 스웨터에서 바구니까지 이어져 있다."));
  say([["sys","201호. 은은한 라벤더 향과 털실 냄새가 난다."],["me","아무도 없는데… 누군가 방금까지 뜨개질을 하고 있었던 것 같아."],["sys","반짝이는 곳을 눌러 방을 조사해 보자."]]);
}
$("hintBtn").addEventListener("click",()=>{
  if(busy)return; sfx.tap();
  const h=!S.seenPhoto?"액자 속 사진부터 자세히 보세요. 뒷면도 확인해 보세요."
    :!S.drawerOpen?"사진 뒷면의 날짜를 멈춘 벽시계에 맞춰 보세요. 3월 15일이면…?"
    :!S.letter?"딸칵 소리가 난 협탁 서랍을 열어 보세요."
    :!S.redYarn?"사진 속 딸이 두른 목도리와 같은 색 실을 바구니에서 골라 보세요."
    :!S.sweater?"빨간 실로 스웨터의 남은 소매를 떠 보세요."
    :"완성한 스웨터와 편지를 봉투에 넣어 보세요.";
  line("bell","(어디선가 벨의 목소리가 들린다) "+h);
});

const FIGURE='<svg class="figure" viewBox="0 0 40 40"><g fill="#3b3346"><circle cx="13" cy="9" r="4"/><path d="M7 30 Q13 12 19 30Z"/><rect x="9" y="29" width="2.5" height="8"/><rect x="15" y="29" width="2.5" height="8"/><path d="M18 20 Q24 26 27 30" stroke="#3b3346" stroke-width="1.2" fill="none"/><ellipse cx="30" cy="32" rx="6" ry="3.6"/><circle cx="35" cy="28" r="3"/><path d="M33 25 q-1 4 -3 5" stroke="#3b3346" stroke-width="2" fill="none"/></g></svg>';
function openPhoto(){
  modal('<button class="gbtn ghostbtn close">닫기</button><div class="photo" id="ph">'+FIGURE+'<div class="lensring"></div><div class="back" hidden><span class="date">3월 15일</span><span>우리 딸 일곱 살 생일.</span><span>빨간 목도리가 참 잘 어울렸지.</span><span style="margin-top:auto;color:#8a7a6a">— 엄마가</span></div></div>'+
    '<div class="row"><button class="gbtn" id="lensB">돋보기</button><button class="gbtn" id="flipB">뒤집기</button></div>',m=>{
    const ph=m.querySelector("#ph"), back=ph.querySelector(".back");
    m.querySelector("#lensB").addEventListener("click",()=>{
      if(!back.hidden)return; sfx.tap(); ph.classList.toggle("lens");
      if(ph.classList.contains("lens")&&!S.sawFigure){S.sawFigure=true;toast("숨은 떡밥 발견!");}
    });
    m.querySelector("#flipB").addEventListener("click",()=>{
      sfx.tap(); back.hidden=!back.hidden; ph.classList.remove("lens");
      ph.style.transform=back.hidden?"rotate(-2deg)":"rotate(2deg)";
      if(!back.hidden&&!S.clue){S.clue=true;}
    });
  });
  if(!S.seenPhoto){S.seenPhoto=true;give("사진");}
  const c=$("modal").querySelector(".close");
  c.addEventListener("click",()=>{
    if(S.sawFigure&&!S._figTalk){S._figTalk=true;say([["me","사진 구석, 나무 옆에… 강아지를 데리고 선 사람이 있었어."],["me","이 사람, 어디서 본 것 같은데."]]);}
    else if(S.clue&&!S._clueTalk){S._clueTalk=true;line("me","3월 15일, 딸의 생일. 그리고 빨간 목도리. 기억해 두자.");}
  });
}
function openClock(){
  if(S.drawerOpen){line("me","시계는 이제 3시 15분을 가리키고 있다. 딸의 생일.");return;}
  let h=7,m=40;
  let nums="";for(let i=1;i<=12;i++){const a=(i*30-90)*Math.PI/180;nums+='<text class="num" x="'+(50+Math.cos(a)*36).toFixed(1)+'" y="'+(53+Math.sin(a)*36).toFixed(1)+'">'+i+'</text>';}
  modal('<button class="gbtn ghostbtn close">닫기</button><div class="ttl">멈춘 벽시계</div>'+
    '<svg class="clock" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#8f5d45"/><circle cx="50" cy="50" r="44" fill="#f4e7cd"/>'+nums+
    '<line id="hh" x1="50" y1="50" x2="50" y2="28" stroke="#2b2233" stroke-width="3.4" stroke-linecap="round"/>'+
    '<line id="mh" x1="50" y1="50" x2="50" y2="15" stroke="#2b2233" stroke-width="2" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#d27a84"/></svg>'+
    '<div class="readout" id="ro"></div><div class="row"><button class="gbtn" id="hB">시침 돌리기</button><button class="gbtn" id="mB">분침 돌리기</button></div>',md=>{
    const set=(el,deg,len)=>{const a=(deg-90)*Math.PI/180;el.setAttribute("x2",(50+Math.cos(a)*len).toFixed(2));el.setAttribute("y2",(50+Math.sin(a)*len).toFixed(2));};
    const draw=()=>{set(md.querySelector("#hh"),(h%12)*30+m*.5,22);set(md.querySelector("#mh"),m*6,35);md.querySelector("#ro").textContent=h+"시 "+String(m).padStart(2,"0")+"분";
      if(h===3&&m===15){S.drawerOpen=true;sfx.solve();setTimeout(()=>{closeModal();say([["sys","딸칵! 협탁 서랍 쪽에서 무언가 풀리는 소리가 났다."],["me","딸의 생일이 열쇠였구나."]]);pingDrawer();},700);}};
    md.querySelector("#hB").addEventListener("click",()=>{if(S.drawerOpen)return;h=h%12+1;sfx.click();draw();});
    md.querySelector("#mB").addEventListener("click",()=>{if(S.drawerOpen)return;m=(m+5)%60;sfx.click();draw();});
    draw();
  });
}
function pingDrawer(){const d=[...scene.querySelectorAll(".hot")].find(b=>b.getAttribute("aria-label")==="협탁 서랍");if(d){d.classList.remove("ping");void d.offsetWidth;d.classList.add("ping");}}
function drawer(){
  if(!S.drawerOpen){sfx.wrong();line("me","서랍이 잠겨 있다. 열쇠 구멍 대신 작은 시계 그림이 새겨져 있다.");return;}
  if(S.letter){line("me","서랍은 이제 비어 있다.");return;}
  S.letter=true; give("편지"); showLetter(()=>say([["me","끝내 부치지 못한 편지였구나."],["me","스웨터가 완성되면 함께 보내려고 했던 거야."]]));
}
function showLetter(after){
  modal('<div class="sheet"><h3>사랑하는 수아에게</h3><p>그날 엄마가 너무 심한 말을 했구나.</p><p>미안하다는 말이 왜 그렇게 어려웠는지 모르겠다.</p><p>네 생일까지 이 스웨터를 다 떠서 편지랑 같이 보내려고 했는데, 소매 하나가 끝내 안 떠지더라.</p><p>생일 축하한다, 우리 딸.</p><p class="sig">— 엄마가</p></div><button class="gbtn" id="lc">편지 접기</button>',m=>{
    m.querySelector("#lc").addEventListener("click",()=>{sfx.tap();closeModal();if(after)after();});
  });
}
function openYarn(){
  if(S.redYarn){line("me","파란 실과 노란 실이 남아 있다.");return;}
  modal('<button class="gbtn ghostbtn close">닫기</button><div class="ttl">어떤 색 실을 가져갈까?</div><div class="row">'+
    '<button class="yarn" data-c="red" aria-label="빨간 실" style="background-color:#d84b5a"></button>'+
    '<button class="yarn" data-c="blue" aria-label="파란 실" style="background-color:#5b7fc4"></button>'+
    '<button class="yarn" data-c="yellow" aria-label="노란 실" style="background-color:#e8c14e"></button></div>',m=>{
    m.querySelectorAll(".yarn").forEach(b=>b.addEventListener("click",()=>{
      if(b.dataset.c==="red"){S.redYarn=true;closeModal();give("빨간 실");line("me","사진 속 목도리와 같은 빨간 실이다. 스웨터와 색이 꼭 맞는다.");}
      else{sfx.wrong();closeModal();line("me",S.clue?"이 색은 아닌 것 같다. 사진 속 딸의 목도리는…":"어떤 색이 맞는지 모르겠다. 단서가 더 필요해.");}
    }));
  });
}
function sweater(){
  if(S.sweater){line("me","완성된 스웨터. 손끝이 따뜻해진다.");return;}
  if(!S.redYarn){line("me","소매 하나가 덜 떠진 빨간 스웨터. 실이 다 떨어진 것 같다.");return;}
  let p=0;
  modal('<div class="ttl">빨간 실로 남은 소매를 뜨자!</div><button class="needle" id="nd" aria-label="뜨개질하기">🧶</button><div class="knitbar"><i id="kb"></i></div><div class="readout" style="font-size:4.6cqw">실뭉치를 빠르게 연타!</div>',m=>{
    const kb=m.querySelector("#kb"), nd=m.querySelector("#nd");
    let decay=setInterval(()=>{if(p>0&&p<100){p=Math.max(0,p-2);kb.style.width=p+"%";}},120);
    nd.addEventListener("click",()=>{
      if(p>=100)return; p=Math.min(100,p+8); kb.style.width=p+"%"; sfx.knit();
      nd.style.transform="rotate("+(p%16?-12:12)+"deg) scale(1.08)"; setTimeout(()=>nd.style.transform="",80);
      if(p>=100){clearInterval(decay);S.sweater=true;take("빨간 실");sfx.solve();
        setTimeout(()=>{closeModal();give("스웨터");say([["sys","마지막 코를 꿰자, 방 안 공기가 포근해졌다."],["me","드디어 완성이야. 이제 편지와 함께 보내기만 하면 돼."]]);},600);}
    });
  });
}
function envelope(){
  if(!(S.sweater&&S.letter)){
    line("me",S.letter||S.sweater?"봉투에 넣을 게 아직 하나 더 남은 것 같다.":"주소가 적힌 빈 봉투다. '수아에게'. 아직 아무것도 들어 있지 않다.");return;
  }
  take("편지");take("스웨터");sfx.item();
  say([["sys","편지와 스웨터를 봉투에 넣고 꼭 여몄다."],["sys","그때, 방문 틈으로 환한 빛이 새어 들어왔다."]],checkout);
}

/* ---------- 4. 체크아웃 ---------- */
function checkout(){
  $("hintBtn").hidden=true; $("inv").hidden=true; scene.innerHTML=""; $("glow").classList.add("on"); sfx.solve();
  setTimeout(()=>say([
    ["ghost","고마워요, 젊은 양반."],
    ["ghost","그 애한테 미안하다는 말… 이제야 할 수 있겠어요."],
    ["ghost","그런데 당신, 어디서 본 것 같은데. 강아지를 참 좋아하는 얼굴이야."],
    ["sys","할머니는 빛 속으로 천천히 걸어 나갔다."]
  ],()=>{
    S.stamps=1; sfx.ding();
    modal('<div class="card"><h2>201호 체크아웃 완료</h2><div class="sub">열쇠에 도장이 찍혔어요</div>'+
      '<div class="stamps"><span class="stamp done"></span><span class="stamp"></span><span class="stamp"></span><span class="stamp"></span><span class="stamp"></span></div>'+
      '<div class="guest">방명록 1장: <b>김순자 할머니의 스웨터</b></div>'+
      (S.sawFigure?'<div class="sub">숨은 떡밥 1/1 발견</div>':'<div class="sub">숨은 떡밥 0/1 · 사진을 돋보기로 봤나요?</div>')+
      '<button class="gbtn gold" id="back">로비로 돌아가기</button></div>',m=>{
      m.querySelector("#back").addEventListener("click",()=>{sfx.tap();closeModal();go(lobbyAfter);});
    });
  }),900);
}

/* ---------- 5. 데모 끝 ---------- */
function lobbyAfter(){
  $("glow").classList.remove("on"); lobbyBase();
  say([
    ["bell","201호 손님이 체크아웃하셨군요! 와, 열쇠에 도장이 찍혔네요!"],
    ["bell","손님은 정말… 예전이랑 똑같이 다정하시네요."],
    ["me","예전? 우리 전에 만난 적 있어?"],
    ["bell","에? 아, 아니에요! 말이 헛나왔어요. 헤헤…"],
    ["sys","그때, 엘리베이터 쪽에서 '띵' 소리가 났다. 아무도 누르지 않았는데, 버튼 하나가 희미하게 깜빡인다."],
    ["mgr","(쪽지) 13층은 존재하지 않습니다. 손님은 여기 계속 머무르시면 됩니다."]
  ],()=>{
    modal('<div class="card"><h2>데모 끝</h2><div class="sub">2층 · 하지 못한 말</div>'+
      '<div class="stamps"><span class="stamp done"></span><span class="stamp"></span><span class="stamp"></span><span class="stamp"></span><span class="stamp"></span></div>'+
      '<div class="guest">202호 은퇴한 권투선수, 203호 연을 든 소년의 방이 곧 열려요.</div>'+
      '<div class="row"><button class="gbtn gold" id="again">처음부터</button><button class="gbtn ghostbtn" id="spoil" style="color:var(--ink);border-color:#0003;background:#0000">엔딩 미리보기 (스포일러)</button></div></div>',m=>{
      m.querySelector("#again").addEventListener("click",()=>{sfx.tap();closeModal();Object.assign(S,{inv:[],seenPhoto:false,clue:false,drawerOpen:false,letter:false,redYarn:false,sweater:false,stamps:0,sawFigure:false,_figTalk:false,_clueTalk:false});go(title);});
      m.querySelector("#spoil").addEventListener("click",()=>{sfx.tap();closeModal();go(ending);});
    });
  });
}
function ending(){
  bg.src="img/ending.jpg"; scene.innerHTML=""; $("hud").hidden=true;
  say([["sys","…그리고 아주 먼 훗날, 13층 마지막 방을 나선 뒤."],["bell","이번엔… 끝까지 같이 걸어줄 거죠?"],["me","응. 이번엔 끝까지."],["sys","마지막 산책 · 계속"]],()=>{
    const g=document.createElement("div");g.style.cssText="position:absolute;left:0;right:0;bottom:8cqw;display:flex;justify-content:center";
    g.innerHTML='<button class="gbtn">타이틀로</button>';g.querySelector("button").addEventListener("click",()=>{sfx.tap();go(title);});scene.appendChild(g);
  });
}

/* 이미지 미리 불러오기 */
["lobby","room201","ending"].forEach(n=>{const i=new Image();i.src="img/"+n+".jpg";});
title();
})();
</script>
