<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>멍산책 대작전</title>
<meta name="description" content="손그림으로 그린 따뜻한 강아지 산책 키우기 게임. 설치 없이 바로 플레이해요.">
<meta name="theme-color" content="#FBF6EC">
<meta property="og:type" content="website">
<meta property="og:title" content="멍산책 대작전">
<meta property="og:description" content="손그림으로 그린 따뜻한 강아지 산책 키우기 게임. 설치 없이 바로 플레이해요.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
/* 종이 위 손그림 한 장: 위 기록(레벨·코인·기분) / 가운데 그림 무대 / 아래 안내문과 큰 버튼. 따뜻한 종이색 한 가지 테마로 고정 */
:root{
  --paper:#FBF6EC; --paper2:#F4EADA; --ink:#3B3631; --muted:#7A6E62; --line:#E2D5C1;
  --mustard:#EDBB52; --sage:#A8C493; --sage-d:#6F9460; --coral:#E08A6E; --cream:#FFFDF8;
  --hand:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  color-scheme: light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:18px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:7px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.hud{display:flex;flex-direction:column;gap:5px}
.hud .row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.lvl{font-weight:700;font-size:22px;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-family:var(--hand);font-size:17px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);border-radius:var(--wob);padding:1px 12px;cursor:pointer;white-space:nowrap;flex:none}
.stats{display:flex;align-items:center;gap:6px;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-weight:700}
.pill.coin{background:var(--mustard);border:1.5px solid var(--ink);border-radius:var(--wob);padding:0 9px}
.bar{flex:1;min-width:24px;height:11px;border:1.5px solid var(--ink);border-radius:var(--wob);background:var(--cream);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s}
.bar.mood i{background:#F2A7A0}.bar.mood.low i{background:var(--coral)}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:5px}
.steps li{flex:1;text-align:center;font-size:15px;padding:1px 0;border-radius:var(--wob);border:1.5px dashed #CDBFAA;color:var(--muted)}
.steps li.on{background:var(--mustard);border:2px solid var(--ink);color:var(--ink);font-weight:700}
.steps li.done{background:#E6EFDC;border-style:solid;border-color:var(--sage);color:var(--sage-d)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--paper2);border:2.5px solid var(--ink);border-radius:14px 22px 16px 26px/24px 14px 22px 16px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;overflow:hidden}
.ov>*{pointer-events:auto}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%) rotate(-1deg);background:var(--cream);color:var(--ink);border:2px solid var(--ink);padding:4px 16px;border-radius:var(--wob);font-size:18px;font-weight:700;width:max-content;max-width:90%;text-align:center;z-index:5;pointer-events:none}
.toast.bad{background:#F7D9CF}.toast.good{background:#E3EED8}.toast.warn{background:#FBE7B5}
.ctrl{display:flex;flex-direction:column;gap:7px}
.say{margin:0;min-height:2.7em;font-size:19px;line-height:1.35;text-wrap:pretty}
.btns{display:flex;gap:10px;min-height:60px}
button{cursor:pointer}
button:focus-visible{outline:3px dashed var(--coral);outline-offset:3px}
.big{flex:1;font-family:var(--hand);font-weight:700;font-size:23px;line-height:1.1;padding:10px 6px;border:2.5px solid var(--ink);border-radius:var(--wob);background:var(--mustard);color:var(--ink);box-shadow:2px 4px 0 var(--ink);touch-action:none;transition:transform .05s}
.big:active,.big.down{transform:translate(2px,3px);box-shadow:0 1px 0 var(--ink)}
.big.alt{background:var(--sage)}
.big.ghost{background:var(--cream)}
.big.jump{flex:0 0 34%;background:#F3C7B4}
.big[disabled]{opacity:.6;cursor:default;box-shadow:none}
.big.timer{background:linear-gradient(90deg,var(--mustard) calc(var(--p,1)*100%),#F6E3B8 0)}
.panel{background:rgba(255,253,248,.95);border:2px solid var(--ink);border-radius:var(--wob);padding:10px 12px}
.note{font-size:19px;line-height:1.3}
.toprow{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
.card{background:rgba(255,253,248,.94);border:2px solid var(--ink);border-radius:var(--wob);padding:6px 4px;font-family:var(--hand);font-size:17px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:0;min-height:70px;justify-content:center;line-height:1.1;word-break:keep-all;text-align:center}
.card:nth-child(3n){transform:rotate(-1.2deg)}.card:nth-child(3n+1){transform:rotate(.8deg)}
.card .ic{font-size:25px;line-height:1.15;filter:saturate(.7)}
.card.on{background:#FBE7B5;box-shadow:inset 0 0 0 2px var(--mustard)}
.card.empty{opacity:.55;border-style:dashed}
.card.found{background:#F7D9CF}
.packhead{font-size:18px;padding:5px 12px}
.fitlbl{font-weight:700;font-size:21px;margin-bottom:6px}
.meter{height:36px;border:2px solid var(--ink);border-radius:var(--wob);background:var(--cream);position:relative;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#BFD6AA 0 6px,#D3E4C3 6px 12px)}
.mark{position:absolute;top:2px;bottom:2px;width:7px;background:var(--ink);border-radius:4px 2px 5px 2px}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--mustard)}
.todo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:3px 10px;align-self:flex-start;max-width:72%}
.chip{font-size:17px;padding:0 10px;border-radius:var(--wob);border:1.5px dashed #BDAF9A;color:var(--muted)}
.chip.ok{background:var(--sage);border:1.5px solid var(--ink);color:var(--ink)}
.dist{width:70px;height:10px;border:1.5px solid var(--ink);border-radius:var(--wob);overflow:hidden;background:var(--cream)}
.dist i{display:block;height:100%;width:0;background:var(--mustard)}
.paws{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;touch-action:none}
.pawbox{display:flex;flex-direction:column;align-items:center;gap:0;font-size:17px}
.paw{position:relative;width:100%;max-width:104px;aspect-ratio:1;border-radius:48% 52% 46% 54%/52% 46% 54% 48%;background:#FFF8EE;border:2px solid var(--ink);touch-action:none;overflow:hidden}
.paw svg{position:absolute;inset:14%;width:72%;height:72%}
.mud{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 30% 35%,#8A6544 0 17%,transparent 19%),radial-gradient(circle at 68% 30%,#94704D 0 13%,transparent 15%),radial-gradient(circle at 55% 68%,#7C5A3B 0 21%,transparent 23%),radial-gradient(circle at 25% 72%,#94704D 0 11%,transparent 13%),rgba(140,105,70,.5)}
.mud.snowy{background:radial-gradient(circle at 30% 35%,#fff 0 18%,transparent 19%),radial-gradient(circle at 68% 30%,#F4FAFF 0 15%,transparent 16%),radial-gradient(circle at 55% 68%,#fff 0 22%,transparent 23%),radial-gradient(circle at 25% 72%,#EAF4FB 0 12%,transparent 13%),rgba(150,130,110,.45)}
.paw.clean::after{content:"반짝";position:absolute;right:4%;top:4%;font-family:var(--hand);font-weight:700;font-size:15px;color:var(--ink);background:var(--mustard);border:1.5px solid var(--ink);padding:0 6px;border-radius:var(--wob)}
/* 고르기 화면 */
.setup{margin:auto 0;display:flex;flex-direction:column;gap:4px;max-height:100%;overflow-y:auto}
.setup h1{font-size:30px;margin:0;text-align:center;line-height:1.1}
.eyebrow{margin:2px 0 0;font-size:17px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.opt{border:2px solid var(--ink);background:var(--cream);border-radius:var(--wob);padding:4px;display:flex;align-items:center;gap:6px;font-family:var(--hand);color:var(--ink);text-align:left;min-width:0}
.opt img{height:56px;width:52px;object-fit:contain;flex:none}
.pick.dogs .opt img{height:40px;width:44px}.trait{margin:0;font-size:16px;color:var(--muted);text-align:center}
.opt b{font-size:18px;display:block;line-height:1.1}
.opt span{font-size:14px;color:var(--muted);line-height:1.1;display:block}
.opt.on{background:#FBE7B5;box-shadow:inset 0 0 0 2px var(--mustard)}
.field{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--muted)}
.field input{flex:1;min-width:0;font-family:var(--hand);font-size:19px;font-weight:700;color:var(--ink);background:var(--cream);border:2px solid var(--ink);border-radius:var(--wob);padding:1px 12px;-webkit-user-select:text;user-select:text}
.rowr{display:flex;gap:6px;flex:none}
.mini[disabled]{opacity:.5;border-style:dashed;cursor:default}
.nose{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nose .card{min-height:64px;font-size:19px;font-weight:700}
.logo{margin:5% auto 0;text-align:center;font-weight:700;line-height:1;transform:rotate(-3deg);pointer-events:none}
.logo span{display:block;font-size:clamp(46px,16vw,76px);letter-spacing:-.02em;text-shadow:3px 3px 0 var(--cream)}
.logo span+span{display:inline-block;padding:0 14px;background:linear-gradient(transparent 58%,var(--mustard) 58%)}
.logo small{display:block;font-size:19px;font-weight:400;color:var(--muted);margin-top:6px;text-shadow:none}
.saved{margin-top:auto;align-self:flex-end;font-size:15px;color:var(--muted);background:rgba(255,253,248,.88);border:1.5px dashed #BDAF9A;border-radius:var(--wob);padding:0 10px;pointer-events:none}
/* 장소·상점 목록 */
.list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:100%}
.rowbtn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;text-align:left;border:2px solid var(--ink);background:rgba(255,253,248,.96);border-radius:var(--wob);padding:5px 12px;font-family:var(--hand);color:var(--ink);line-height:1.15}
.rowbtn b{font-size:21px}
.rowbtn span{grid-column:1;font-size:16px;color:var(--muted)}
.rowbtn em{grid-row:1/3;grid-column:2;font-style:normal;font-weight:700;font-size:17px;background:var(--mustard);border:1.5px solid var(--ink);border-radius:var(--wob);padding:0 9px}
.rowbtn[disabled]{opacity:.55;border-style:dashed;cursor:default}
.rowbtn[disabled] em{background:var(--cream)}
.clearcard{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;max-height:100%;overflow-y:auto}
.clearcard .duo{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:92px}
.clearcard .duo img{height:100%;width:auto}
.clearcard .duo img.dg{height:56%}
.clearcard h2{font-weight:700;font-size:30px;margin:0;line-height:1.1}
.stars{font-size:34px;letter-spacing:6px;color:#DCD0BE;line-height:1}
.stars .on{color:var(--mustard);-webkit-text-stroke:1.5px var(--ink)}
.clearcard p{margin:0;font-size:18px}
.gain{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.gain span{border:1.5px solid var(--ink);border-radius:var(--wob);padding:0 10px;background:var(--cream);font-weight:700}
.gain .up{background:var(--sage)}.gain .dn{background:#F7D9CF}
.news{background:#FBE7B5;border:1.5px solid var(--ink);border-radius:var(--wob);padding:0 12px;font-weight:700}
@media (prefers-reduced-motion:reduce){.big,.bar i{transition:none}}
</style>

<div id="app">
  <header class="hud" id="hud">
    <div class="row"><div class="lvl" id="lvlName">멍산책 대작전</div><span class="rowr"><button class="mini" data-act="snd" id="sndBtn">소리 켬</button><button class="mini" data-act="quit" id="quitBtn" hidden>그만하기</button></span></div>
    <div class="stats" id="stats" hidden><span class="pill" id="pLv">Lv.1</span><span class="bar" title="경험치"><i id="xpbar"></i></span><span class="pill coin" id="pCoin">코인 0</span><span class="pill" id="pMood">기분</span><span class="bar mood" id="moodwrap" title="기분"><i id="moodbar"></i></span></div>
    <ol class="steps" id="steps" hidden><li>하네스</li><li>챙기기</li><li>산책</li><li>발 닦기</li><li>간식</li></ol>
  </header>
  <main class="stage" id="stage"><canvas id="cv"></canvas><div class="ov" id="ov"></div><div class="toast" id="toast" hidden></div></main>
  <footer class="ctrl"><p class="say" id="say" aria-live="polite"></p><div class="btns" id="btns"></div></footer>
</div>

const later=(fn,ms)=>{const s=S;setTimeout(()=>{if(S===s)fn()},ms)};
const N=()=>G.dogName||'강아지', HN=()=>G.names[G.who]||'나';
const jo=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b)};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 옛날 게임기 소리 (삑삑 전자음) ---------- */
let AC=null;
function ac(){if(!G.snd)return null;if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type='square',v=.05,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SFX={tap:()=>tone(660,0,.05),good:()=>{tone(523,0,.08);tone(784,.08,.12)},bad:()=>tone(196,0,.24,'sawtooth',.045,104),warn:()=>{tone(880,0,.08);tone(660,.1,.08);tone(880,.2,.08)},
  coin:()=>{tone(988,0,.06);tone(1319,.06,.16)},jump:()=>tone(330,0,.16,'square',.045,700),step:()=>tone(140,0,.03,'triangle',.05),bark:()=>{tone(300,.12,.06,'square',.06,210);tone(330,.22,.07,'square',.06,220)},
  level:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.13)),clear:()=>[523,659,784,659,1047].forEach((f,i)=>tone(f,i*.11,.15)),throw:()=>tone(480,0,.3,'triangle',.06,950),
  eat:()=>[0,.1,.2,.3].forEach((t,i)=>tone(i%2?250:210,t,.05)),sniff:()=>{tone(1200,0,.03,'triangle',.04);tone(1300,.07,.03,'triangle',.04)},sick:()=>tone(330,0,.5,'triangle',.05,160)};
function sfx(n){try{SFX[n]&&SFX[n]()}catch(e){}}
const TUNE=[523,0,659,0,784,659,523,0,587,0,698,0,880,698,587,0,659,0,784,0,1047,784,659,0,587,523,494,0,523,0,0,0];let bgmI=0,bgmT=0;
function bgm(dt){if(!G.snd||!AC||!(scene==='walk'||scene==='run'||scene==='fetch'))return;bgmT-=dt;if(bgmT<=0){bgmT=.19;const f=TUNE[bgmI++%TUNE.length];if(f)tone(f/2,0,.15,'triangle',.022)}}
const place=()=>PLACES[S.place]||PLACES.park;
const indoor=()=>!!place().indoor&&scene!=='home';
function rollWeather(){const r=Math.random(),lv=G.lv;
  if(lv<=1)return r<.7?'sun':'rain';
  if(lv===2)return r<.5?'sun':r<.75?'rain':'snow';
  return r<.4?'sun':r<.6?'rain':r<.75?'snow':r<.9?'wind':(lv>=4?'storm':'wind')}
/* 오늘 산책의 난이도: 레벨이 오를수록 어려워져요 */
function conf(){const t=Math.min(4,G.lv-1),w=WEATHER[G.weather],pl=place(),ind=!!pl.indoor;
  const n=2+Math.floor((t+1)/2),ev=[];for(let i=0;i<n;i++)ev.push(i%2?'poo':'pee');
  return{t,ind,w:G.weather,hidden:[4,6,6,8,8][t],zone:Math.min(.42,[.3,.26,.22,.19,.16][t]*(1+.3*G.up.harness)*(G.dog==='poodle'?1.25:1)),speed:1.2+.3*t,
    events:ev,need:['bag','water',...(ind?['wipes']:w.need)],haz:ind?pl.haz:[...w.haz,...(pl.haz||[])],stop:ind?pl.stop:(w.stop||pl.stop||null),len:(pl.short?850:1150)+190*t,sniff:G.dog==='shiba'?1.7:1.3}}

/* ---------- 화면 크기 ---------- */
let cw=0,ch=0;
function resize(){const r=stage.getBoundingClientRect();cw=r.width;ch=r.height;const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(stage);resize();
const dscale=()=>clamp(ch/400,.7,1.35);
const has=id=>S.packed&&S.packed.has(id);
function feetY(){const g=ch*.66;return g+12+(ch-g-12)*.55}
function homeFloor(){return ch*.8}
function dogScreen(){const s=dscale();if(scene==='home'||scene==='vet')return{x:cw*.62,y:ch-20*s,s};return{x:cw*.46,y:feetY(),s}}

/* ---------- 공통 UI ---------- */
function say(t){sayEl.textContent=t}
let toastTimer;
function toast(t,k=''){if(k)sfx(k);toastEl.textContent=t;toastEl.className='toast '+k;toastEl.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.hidden=true,2400)}
function showFace(k){face={e:k,t:0}}
const moodName=()=>G.mood>=80?'최고':G.mood>=60?'좋음':G.mood>=40?'보통':G.mood>=25?'시무룩':'아픔';
function hud(){$('pLv').textContent='Lv.'+G.lv;$('xpbar').style.width=Math.min(100,G.xp/needXP(G.lv)*100)+'%';$('pCoin').textContent='코인 '+G.coins;
  $('pMood').textContent='기분 '+moodName();$('moodbar').style.width=G.mood+'%';$('moodwrap').classList.toggle('low',G.mood<40)}
function addMood(d){if(d>0&&G.dog==='pom')d=Math.round(d*1.2);G.mood=clamp(Math.round(G.mood+d),0,100);hud()}
function addXP(x){const news=[];G.xp+=x;while(G.xp>=needXP(G.lv)){G.xp-=needXP(G.lv);G.lv++;news.push(`레벨 업! Lv.${G.lv}`);
  for(const k in PLACES)if(PLACES[k].lv===G.lv)news.push(`새 장소가 열렸어요: ${PLACES[k].name}`)}hud();return news}
function mistake(m){S.mist=(S.mist||0)+1;addMood(-1);toast(m,'bad');showFace('worry');try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function burst(){const p=dogScreen();for(let i=0;i<5;i++)hearts.push({x:p.x+rand(-30,30)*p.s,y:p.y-70*p.s,t:-i*.12,r:rand(-.3,.3)})}
function praiseUp(m){S.praise=(S.praise||0)+1;toast(m,'good');sfx('bark');showFace('smile');burst()}
function setStep(i){$('steps').hidden=i===null;if(i===null)return;[...$('steps').children].forEach((li,k)=>li.className=k<i?'done':k===i?'on':'')}
function chrome(titleText,quit){$('lvlName').textContent=titleText;$('quitBtn').hidden=!quit;$('stats').hidden=!G.started}

const ACT={};

ACT.snd=b=>{G.snd=!G.snd;save();b.textContent=G.snd?'소리 켬':'소리 끔';if(G.snd)sfx('good')};

/* ---------- 강아지 얼굴 그림(고르기 화면용) ---------- */
const thumbs={};
function thumb(b){if(b==='pom')return SRC.d_front;if(thumbs[b])return thumbs[b];const c=document.createElement('canvas');c.width=180;c.height=170;const old=ctx;ctx=c.getContext('2d');
  ctx.translate(90,160);doodleDog(b,'front',120);ctx=old;return thumbs[b]=c.toDataURL()}

function pthumb(w){if(w==='m')return SRC.p_front;if(thumbs.girl)return thumbs.girl;const c=document.createElement('canvas');c.width=170;c.height=300;const old=ctx;ctx=c.getContext('2d');
  ctx.translate(85,292);drawGirl('front',280);ctx=old;return thumbs.girl=c.toDataURL()}
/* ---------- 시작 화면: 새 산책하기 / 불러오기 ---------- */
function titleScreen(){S={phase:'title'};scene='title';holding=false;face=null;setStep(null);$('lvlName').textContent='';$('quitBtn').hidden=true;$('stats').hidden=true;const sv=peek();
  ov.innerHTML='<div class="logo"><span>멍산책</span><span>대작전</span><small>오늘도 잘 지내보자</small></div>';
  btns.innerHTML=`<button class="big" data-act="newGame">새 산책하기</button><button class="big alt" data-act="loadGame" ${sv?'':'disabled'}>불러오기</button>`;
  say(sv?`저장된 산책: ${sv.names[sv.who]} · ${sv.dogName} · Lv.${sv.lv} · ${sv.day}일째. 불러오기를 누르면 이어서 해요.`:'새 산책하기를 눌러 시작해요. 산책이 끝날 때와 집에 있을 때 자동으로 저장돼요.')}
ACT.newGame=b=>{if(peek()&&!S.ask){S.ask=true;b.textContent='정말 새로 할까요?';say('새로 시작하면 저장된 산책 기록 위에 덮어써요. 한 번 더 누르면 새 산책을 시작해요.');return}
  const snd=G.snd;G=JSON.parse(JSON.stringify(DEF));G.snd=snd;setup()};
ACT.loadGame=()=>{if(!peek())return;G=load();$('sndBtn').textContent=G.snd?'소리 켬':'소리 끔';hub();toast('저장된 산책을 불러왔어요','good')};
ACT.title=()=>{if(!G.started)G=load();titleScreen()};
/* ---------- 처음: 캐릭터와 강아지 고르기 ---------- */
function setup(){S={phase:'setup'};scene='home';dog.mood='idle';dog.harness=false;setStep(null);chrome('멍산책 대작전',false);
  ov.innerHTML=`<div class="panel setup"><h1>멍산책 대작전</h1><p class="eyebrow">누가 산책할까요?</p>
  <div class="pick">${['m','f'].map(w=>`<button class="opt ${G.who===w?'on':''}" data-act="pickWho" data-id="${w}"><img src="${pthumb(w)}" alt=""><span><b>${esc(G.names[w])}</b></span></button>`).join('')}</div>
  <label class="field"><span>이름</span><input id="nmWho" maxlength="8" autocomplete="off" value="${esc(G.names[G.who])}"></label>
  <p class="eyebrow">어떤 강아지랑?</p>
  <div class="pick dogs">${Object.keys(BREED).map(b=>`<button class="opt ${G.dog===b?'on':''}" data-act="pickDog" data-id="${b}"><img src="${thumb(b)}" alt=""><span><b>${BREED[b].name}</b></span></button>`).join('')}</div>
  <p class="trait">${BREED[G.dog].trait}</p>
  <label class="field"><span>강아지 이름</span><input id="nmDog" maxlength="8" autocomplete="off" value="${esc(G.dogName)}"></label></div>`;
  btns.innerHTML=`${G.started?'':'<button class="big ghost" data-act="title">뒤로</button>'}<button class="big" data-act="begin">${G.started?'이대로 할게요':'산책 시작!'}</button>`;
  say('함께할 사람과 강아지를 고르고 이름을 지어 주세요. 강아지마다 성격이 달라요.')}
ov.addEventListener('input',e=>{const v=e.target.value.trim();if(e.target.id==='nmWho'){G.names[G.who]=v||DEF.names[G.who];const b=ov.querySelector('.opt.on b');if(b)b.textContent=G.names[G.who]}if(e.target.id==='nmDog')G.dogName=v||DEF.dogName});
ACT.pickWho=b=>{G.who=b.dataset.id;setup()};
ACT.pickDog=b=>{G.dog=b.dataset.id;setup()};
ACT.begin=()=>{G.started=true;save();hub()};
ACT.setup=setup;
ACT.quit=()=>hub();

/* ---------- 집(하루의 시작) ---------- */
function hub(){S={phase:'hub'};scene='home';holding=false;dog.harness=false;face=null;setStep(null);chrome(`${G.day}일째 · ${WEATHER[G.weather].name}`,false);hud();const saved=save()?'<div class="saved">자동 저장됨</div>':'<div class="saved">이 브라우저에서는 저장이 안 돼요</div>';
  if(G.mood<25){dog.mood='sick';const c=Math.min(G.coins,vetCost());
    ov.innerHTML=`<div class="panel note">끙끙… ${esc(jo(N(),'이','가'))} 기분이 너무 가라앉아서 아파요. 병원에 데려가야 해요.</div>`;
    ov.innerHTML+=saved;btns.innerHTML=`<button class="big" data-act="vet">병원 가기 (코인 ${c})</button>`;
    say('산책을 못 하거나, 밥을 굶거나, 간식이 맛없으면 기분이 내려가요. 기분이 바닥나면 아파요.');return}
  dog.mood=G.fed?'happy':'idle';const d=G.did,mk=(act,t,done)=>`<button class="mini" data-act="${act}" ${done?'disabled':''}>${t}${done?' ✓':''}</button>`;
  ov.innerHTML=`<div class="toprow">${mk('hTreat','간식 주기',d.treat)}${mk('nose','노즈워킹',d.nose)}${mk('tug','놀아주기',d.play)}</div><div class="toprow"><button class="mini" data-act="shop">상점</button><button class="mini" data-act="setup">캐릭터·이름</button><button class="mini" data-act="rest">오늘은 쉬기</button><button class="mini" data-act="title">처음 화면</button></div>${saved}`;
  btns.innerHTML=(G.fed?'':'<button class="big alt" data-act="feed">밥 주기</button>')+'<button class="big" data-act="places">산책 가기</button>';
  say(!G.fed?`좋은 아침! ${N()}에게 먼저 밥을 챙겨 주세요. 굶기면 기분이 뚝 떨어져요.`:G.mood<45?`${jo(N(),'이','가')} 시무룩해요. 오늘은 신나게 놀아 줘요!`:`${N()}랑 뭐 할까요? 집에서 놀아도 되고, 산책을 나가도 좋아요.`)}
ACT.feed=()=>{if(G.fed)return;G.fed=true;addMood(FOOD_MOOD[G.up.food]);dog.mood='eat';sfx('eat');toast(`${SHOP.food.tiers[G.up.food][0]} 냠냠!`,'good');burst();const s=S;setTimeout(()=>{if(S===s)hub()},1300);btns.innerHTML='';save()};
ACT.rest=b=>{if(!S.restAsk){S.restAsk=true;b.textContent='정말 쉴까요? 기분이 내려가요';return}const played=G.did.nose||G.did.play;addMood(played?-8:-18);nextDay(played?'산책은 못 갔지만 집에서 놀아서 덜 시무룩해요':'산책을 못 가서 시무룩해요')};
function nextDay(note){let n=note||'';if(!G.fed){addMood(-15);n='밥을 못 먹어서 기분이 많이 내려갔어요'}G.mood=clamp(G.mood-5,0,100);G.fed=false;G.did={};G.day++;G.weather=rollWeather();hub();if(n)toast(n,'bad')}
/* ---------- 집에서 놀기: 간식 주기 · 노즈워킹 · 터그 놀이 ---------- */
ACT.hTreat=()=>{S={phase:'',home:true};chrome('간식 시간',true);phaseTreat()};
const NB=i=>{const r=Math.floor(i/3),c=i%3,o=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){const rr=r+y,cc=c+x;if((x||y)&&rr>=0&&rr<3&&cc>=0&&cc<3)o.push(rr*3+cc)}return o};
ACT.nose=()=>{S={phase:'nose',home:true};scene='home';chrome('노즈워킹',true);setStep(null);dog.mood='wiggle';
  S.N={tr:new Set(shuffle([0,1,2,3,4,5,6,7,8]).slice(0,3)),open:new Set(),tries:6,found:0};renderNose();btns.innerHTML='';
  say(`컵 9개 중 3개에 간식을 숨겼어요. 컵을 누르면 ${jo(N(),'이','가')} 냄새를 맡아요. "킁" 개수는 바로 옆 컵(대각선 포함)에 숨은 간식 수예요. 6번 안에 다 찾아봐요!`)};
function renderNose(){const M=S.N;ov.innerHTML=`<div class="panel packhead">남은 킁킁 <b>${M.tries}</b>번 · 찾은 간식 <b>${M.found}/3</b></div><div class="nose">${[0,1,2,3,4,5,6,7,8].map(i=>{
  if(!M.open.has(i))return `<button class="card" data-act="sn" data-i="${i}"><span class="ic">🥤</span></button>`;
  if(M.tr.has(i))return '<button class="card found" disabled><span class="ic">🦴</span><span>간식!</span></button>';
  const k=NB(i).filter(j=>M.tr.has(j)).length;return `<button class="card empty" disabled>${k?'킁'.repeat(k):'냄새 없음'}</button>`}).join('')}</div>`}
ACT.sn=b=>{const M=S.N,i=+b.dataset.i;if(!M||M.done||M.open.has(i))return;M.open.add(i);M.tries--;
  if(M.tr.has(i)){M.found++;sfx('coin');burst();dog.mood='happy'}else{sfx('sniff');dog.mood='wiggle'}renderNose();
  if(M.found===3||M.tries===0){M.done=true;const win=M.found===3,c=win?4+M.tries*2:M.found;G.coins+=c;G.did.nose=true;addMood(win?9:4);const nw=addXP(8);
    win?praiseUp(`코 박사 ${N()}! 코인 +${c}`):toast(`오늘은 ${M.found}개 찾았어요. 코인 +${c}`,'good');later(()=>{hub();if(nw.length){toast(nw[0],'good');sfx('level')}},1700)}};
ACT.tug=()=>{S={phase:'tug',home:true};scene='home';chrome('터그 놀이',true);setStep(null);dog.mood='wiggle';S.U={t:0,dur:10,p:.5,f:.3,fn:0,inz:0};
  ov.innerHTML='<div class="panel"><div class="fitlbl" id="fitlbl">터그 놀이 · 10초</div><div class="meter"><div class="zone" style="left:35%;width:30%"></div><div class="mark" id="mark"></div></div></div>';
  btns.innerHTML='<button class="big" data-tug="1">당겨!</button>';
  say(`줄다리기 놀이! ${jo(N(),'이','가')} 줄을 끌어가요. "당겨!"를 톡톡 눌러 매듭이 가운데 줄무늬 칸에 머물게 해요. 팽팽해야 재미있대요.`)};
function updTug(dt){const U=S.U;U.t+=dt;U.fn-=dt;if(U.fn<=0){U.fn=rand(.7,1.5);U.f=rand(.18,.62)}U.p=clamp(U.p-U.f*dt,0,1);const ok=U.p>.35&&U.p<.65;if(ok)U.inz+=dt;
  const m=$('mark');if(m)m.style.left=`calc(${U.p*100}% - 3px)`;const l=$('fitlbl');if(l)l.textContent=`터그 놀이 · ${Math.max(0,Math.ceil(U.dur-U.t))}초`;
  if(U.t>=U.dur){const sc=U.inz/U.dur,c=Math.round(sc*8)+1;G.coins+=c;G.did.play=true;addMood(Math.round(4+sc*8));const nw=addXP(8);S.U=null;S.phase='tugdone';btns.innerHTML='';dog.mood='happy';
    sc>.5?praiseUp(`신나게 놀았어요! 코인 +${c}`):toast(`놀이 끝! 코인 +${c}`,'good');later(()=>{hub();if(nw.length){toast(nw[0],'good');sfx('level')}},1600)}}
ACT.vet=()=>{const c=Math.min(G.coins,vetCost());G.coins-=c;hud();S={phase:'vet'};scene='vet';ov.innerHTML='';btns.innerHTML='';chrome('동물병원',false);
  sfx('sick');say(`병원에 왔어요. 주사 콕! ${jo(N(),'이','가')} 금방 괜찮아질 거예요.`);later(()=>{G.mood=55;hub();toast(`치료비로 코인 ${c}을 썼어요`,'warn')},2800)};

/* ---------- 상점 ---------- */
function shop(){S={phase:'shop'};chrome('상점',false);
  ov.innerHTML=`<div class="list">${Object.entries(SHOP).map(([id,it])=>{const cur=G.up[id],nx=it.tiers[cur+1];

      :`<button class="rowbtn" disabled><b>${it.tiers[cur][0]}</b><span>${it.name} · 최고 단계예요</span><em>완료</em></button>`}).join('')}</div>`;
  btns.innerHTML='<button class="big ghost" data-act="back">집으로</button>';say('코인으로 간식과 장비를 바꿀 수 있어요. 맛있는 간식은 기분을 올려 줘요.')}

ACT.buy=b=>{const id=b.dataset.id,nx=SHOP[id].tiers[G.up[id]+1];if(!nx||G.coins<nx[2])return;G.coins-=nx[2];G.up[id]++;hud();save();shop();toast(`${nx[0]} 장만!`,'good')};

/* ---------- 장소 고르기 ---------- */
function places(){S={phase:'places'};chrome(`${G.day}일째 · ${WEATHER[G.weather].name}`,false);const wet=G.weather==='rain'||G.weather==='snow'||G.weather==='storm';
  ov.innerHTML=`<div class="list">${PLACE_ORDER.map(id=>{const p=PLACES[id];let lock='';
    if(G.lv<p.lv)lock=`Lv.${p.lv}이 되면 열려요`;else if(p.wetOnly&&!wet)lock='비·눈 오는 날에만 가요';else if(p.fee&&G.coins<p.fee)lock=`입장료 코인 ${p.fee}이 필요해요`;
    return `<button class="rowbtn" data-act="go" data-id="${id}" ${lock?'disabled':''}><b>${p.name}</b><span>${lock||p.desc}</span>${lock?'<em>잠김</em>':p.fee?`<em>코인 ${p.fee}</em>`:''}</button>`}).join('')}</div>`;
  btns.innerHTML='<button class="big ghost" data-act="back">뒤로</button>';
  say(wet?'날씨가 궂어요. 옷을 잘 챙기거나 실내로 가 볼까요?':'어디로 갈까요? 레벨이 오르면 갈 수 있는 곳이 늘어나요.')}
ACT.places=places;
ACT.go=b=>{const id=b.dataset.id;if(id==='cafe')return startCafe();if(id==='yard')return startYard();
  S={phase:'',place:id,mist:0,praise:0,dirt:0,packed:new Set(),gameCoins:0,gameXP:0,W:null};S.C=conf();chrome(`${place().name} · ${WEATHER[G.weather].name}`,true);phaseFind()};

function startYard(){G.coins-=PLACES.yard.fee;hud();S={phase:'',place:'yard',mist:0,praise:0,gameCoins:0,gameXP:0};setStep(null);dog.harness=false;chrome('애견운동장',true);
  startFetch(()=>startRun(()=>result('yard')))}
/* ---------- 1. 하네스 찾기 ---------- */
function phaseFind(){S.phase='find';scene='home';setStep(0);dog.mood='wiggle';dog.harness=false;holding=false;
  const spots=shuffle(HIDE).slice(0,S.C.hidden);S.find={spots,ans:Math.floor(Math.random()*spots.length),done:false};
  ov.innerHTML=`<div class="grid">${spots.map((h,i)=>`<button class="card" data-act="search" data-i="${i}"><span class="ic">${h[1]}</span><span>${h[0]}</span></button>`).join('')}</div>`;
  btns.innerHTML='';say('산책 가자! 그런데 하네스가 어디 있지? 숨어 있을 만한 곳을 눌러 찾아보세요.');}
ACT.search=b=>{const Fd=S.find;if(!Fd||Fd.done||b.classList.contains('empty'))return;const i=+b.dataset.i;
  if(i===Fd.ans){Fd.done=true;b.classList.add('found');b.innerHTML='<span class="ic">⭐</span><span>하네스 발견!</span>';toast('하네스를 찾았어요!','good');showFace('wow');later(phaseFit,900)}
  else{b.classList.add('empty');b.innerHTML=`<span class="ic">💨</span><span>${pick(JUNK)}</span>`}};

/* ---------- 1-2. 하네스 채우기 (타이밍) ---------- */
function phaseFit(){S.phase='fit';S.fit={n:0,z:0,ph:Math.random()*6,pos:.5};newZone();
  ov.innerHTML=`<div class="panel"><div class="fitlbl" id="fitlbl">1단계 · 머리 넣기</div><div class="meter"><div class="zone" id="zone"></div><div class="mark" id="mark"></div></div></div>`;
  placeZone();btns.innerHTML='<button class="big" data-act="fit">지금!</button>';
  say('신나서 꿈틀거려요. 움직이는 막대가 줄무늬 칸에 들어왔을 때 "지금!"을 누르세요.');}
function newZone(){S.fit.z=rand(.06,.94-S.C.zone)}
function placeZone(){const z=$('zone');if(z){z.style.left=S.fit.z*100+'%';z.style.width=S.C.zone*100+'%'}}
ACT.fit=()=>{if(S.phase!=='fit')return;const Ft=S.fit;
  if(Ft.pos>=Ft.z&&Ft.pos<=Ft.z+S.C.zone){Ft.n++;
    if(Ft.n===1){toast('머리 쏙! 잘했어요','good');$('fitlbl').textContent='2단계 · 버클 채우기';newZone();placeZone()}
    else{dog.harness=true;dog.mood='happy';toast('딸깍! 하네스 착용 완료','good');showFace('smile');btns.innerHTML='';S.phase='fitdone';later(phasePack,900)}}
  else{mistake('쏙 빠져나갔어요! 다시 해봐요');newZone();placeZone()}};

/* ---------- 2. 챙기기 ---------- */
function phasePack(){S.phase='pack';setStep(1);dog.mood='happy';S.packed=new Set();S.packFail=0;
  ov.innerHTML=`<div class="panel packhead"><b>${place().name}</b> · <b>${WEATHER[G.weather].name}</b> · 가방에 넣을 것을 고르세요</div><div class="grid">${shuffle(Object.keys(ITEMS)).map(id=>`<button class="card" data-act="pack" data-id="${id}" aria-pressed="false"><span class="ic">${ITEMS[id][1]}</span><span>${ITEMS[id][0]}</span></button>`).join('')}</div>`;
  btns.innerHTML='<button class="big alt" data-act="depart">챙겼어요, 출발!</button>';
  say(S.C.ind?'실내로 가요. 실내에서는 쉬를 닦을 것도 필요해요!':'산책에 꼭 필요한 것만 골라요. 날씨도 생각해 보세요!');}
ACT.pack=b=>{const id=b.dataset.id,on=!S.packed.has(id);on?S.packed.add(id):S.packed.delete(id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)};
ACT.depart=()=>{if(S.phase!=='pack')return;const silly=[...S.packed].filter(i=>SILLY.includes(i));
  if(silly.length){mistake(`${silly.map(i=>ITEMS[i][0]).join(', ')}은(는) 산책에 필요 없어요!`);
    silly.forEach(i=>{S.packed.delete(i);const el=ov.querySelector(`[data-id="${i}"]`);if(el){el.classList.remove('on');el.setAttribute('aria-pressed','false')}});return}
  const miss=S.C.need.filter(i=>!S.packed.has(i));
  if(miss.length){S.packFail++;
    if(S.packFail===1)mistake(miss.includes('bag')?'앗, 응가하면 뭘로 치우죠?':miss.includes('wipes')?'실내에서 쉬하면 뭘로 닦죠?':'빠뜨린 게 있어요. 날씨와 목마름을 생각해 보세요!');
    else mistake('빠진 것: '+miss.map(i=>ITEMS[i][0]).join(', '));return}
  phaseWalk()};

/* ---------- 3. 산책 ---------- */
function phaseWalk(){S.phase='walk';scene='walk';setStep(2);dog.mood='idle';dog.jump=0;holding=false;const C=S.C;
  S.W={x:0,spots:[],haz:[],poops:[],ev:C.events.slice(),doneN:0,busy:null,cur:null,sniff:0,fakes:0,len:C.len,genTo:0,fin:false,gust:{st:'calm',t:rand(3,5),hit:false}};
  gen(cw*.6,C.len+cw);
  ov.innerHTML='<div class="panel todo" id="todo"></div>';renderTodo();walkBtns();sayWalk();}
function gen(from,to){const W=S.W,C=S.C;let x=Math.max(from,W.genTo);
  while(x<to){x+=rand(260,400);W.spots.push({x,type:pick(place().spots),real:Math.random()<.62,used:false,seed:Math.random()*1000});
    if(C.haz.length)W.haz.push({x:x+rand(120,180),type:pick(C.haz),hit:false,seed:Math.random()*1000})}
  W.genTo=x}
function renderTodo(){const W=S.W,el=$('todo');if(!el)return;
  el.innerHTML=S.C.events.map((e,i)=>`<span class="chip ${i<W.doneN?'ok':''}">${EVN[e]}${i<W.doneN?' ✓':''}</span>`).join('')+'<span class="dist" title="산책 거리"><i id="distbar"></i></span>'}
function walkBtns(){holding=false;btns.innerHTML=`<button class="big" data-hold="1">꾹 눌러서 걷기</button>${S.C.haz.length?'<button class="big jump" data-act="jump">점프</button>':''}`}
function sayWalk(){const C=S.C,W=S.W;
  let t=W.ev.length?'버튼을 꾹 눌러 걸어요. 킁킁대면 손을 떼고 기다려 주세요.':'볼일은 다 봤어요! 조금만 더 걸으면 끝이에요.';
  if(C.haz.length)t+=` ${[...new Set(C.haz)].map(h=>HAZ[h][0]).join('·')}은 점프로 넘어요.`;
  if(C.stop)t+=' '+STOP[C.stop][2];say(t)}

btns.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.hold){holding=true;b.classList.add('down');try{b.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()}
  else if(b.dataset.charge){if(S.F&&S.F.st==='aim'){S.F.charging=true;b.classList.add('down');try{b.setPointerCapture(e.pointerId)}catch(_){}}e.preventDefault()}
  else if(b.dataset.tap){if(S.R){S.R.sp=Math.min(1,S.R.sp+.09);sfx('step')}e.preventDefault()}
  else if(b.dataset.tug){if(S.U){S.U.p=Math.min(1,S.U.p+.065);sfx('step')}e.preventDefault()}});
const holdUp=e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;
  if(b.dataset.hold){holding=false;b.classList.remove('down')}
  if(b.dataset.charge){b.classList.remove('down');if(S.F&&S.F.charging)throwBall()}};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>btns.addEventListener(n,holdUp));
btns.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(S.phase==='walk'){if(e.key==='ArrowRight'){holding=true;e.preventDefault()}if(e.key===' '||e.key==='ArrowUp'){ACT.jump();e.preventDefault()}}
  if(S.phase==='run'&&S.R&&e.key===' '&&!e.repeat){S.R.sp=Math.min(1,S.R.sp+.09);e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='ArrowRight')holding=false});

ACT.jump=()=>{const W=S.W;if(S.phase!=='walk'||!W||W.busy||W.fin)return;if(dog.jump<=0){dog.jump=.65;sfx('jump')}};

function updWalk(dt){const C=S.C,W=S.W,s=dscale(),dx=cw*.46;
  if(dog.jump>0)dog.jump=Math.max(0,dog.jump-dt);
  const moving=!W.busy&&!W.fin&&(holding||dog.jump>0);W.moving=moving;
  if(moving){W.x+=(C.w==='snow'&&!C.ind?100:125)*s*dt;dog.walkPh+=dt*12;W.st=(W.st||0)-dt;if(W.st<=0){W.st=.26;sfx('step')}}
  const dw=W.x+dx;
  if(C.stop&&!W.fin){const g=W.gust,ST=STOP[C.stop];g.t-=dt;
    if(g.st==='calm'&&g.t<=0&&!W.busy){g.st='warn';g.t=1.4;toast(ST[0],'warn');showFace('wow')}
    else if(g.st==='warn'&&g.t<=0){g.st='gust';g.t=1.8;g.hit=false}
    else if(g.st==='gust'){if(moving&&!g.hit){g.hit=true;mistake(ST[1])}if(g.t<=0){g.st='calm';g.t=rand(4,7)}}}
  for(const h of W.haz){if(h.hit||!moving||dog.jump>.08)continue;
    if(Math.abs(h.x-dw)<20){h.hit=true;S.dirt+=HAZ[h.type][2];mistake(HAZ[h.type][1])}}
  if(!W.busy&&!W.fin){const sp=W.spots.find(o=>!o.used&&Math.abs(o.x-dw)<42);
    if(sp){if(W.cur!==sp){W.cur=sp;W.sniff=0;say('킁킁… 냄새를 맡아요. 손을 떼고 기다려 주세요!')}
      dog.mood='sniff';W.sn=(W.sn||0)-dt;if(W.sn<=0){W.sn=.5;sfx('sniff')}if(!holding&&dog.jump<=0){W.sniff+=dt;if(W.sniff>=C.sniff){sp.used=true;W.cur=null;spotResult(sp)}}}
    else{if(W.cur){W.cur=null;sayWalk()}dog.mood=moving?'walk':'idle'}}
  if(W.busy){const b=W.busy;b.t+=dt;
    if(b.st==='doing'&&b.t>=b.dur){b.st='after';dog.mood='happy';if(b.type==='poo')W.poops.push({x:dw-36*s});eventBtns();
      say(b.type==='poo'?'응가 완료! 봉투로 치우고 칭찬도 해 주세요.':b.wipe?'쉬 완료! 실내니까 물티슈로 닦고, 칭찬도 해 주세요.':'쉬 완료! 바로 칭찬해 주세요!')}
    else if(b.st==='after'){
      if(!b.praised){b.pt-=dt;const pb=btns.querySelector('[data-act="praise"]');if(pb)pb.style.setProperty('--p',Math.max(0,b.pt/b.pmax));
        if(b.pt<=0){b.praised='late';mistake('칭찬 타이밍을 놓쳤어요. 볼일 보면 바로 칭찬!');eventBtns()}}
      if(b.praised&&b.cleaned)endEvent()}}
  if(!W.fin&&!W.busy&&W.ev.length===0&&W.x>=W.len){W.fin=true;holding=false;dog.mood='happy';const g=place().game;
    say(g?`산책 끝! 온 김에 ${GAMES[g]}를 하고 갈까요? 잘하면 코인을 더 받아요.`:'산책 끝! 신나게 걸었어요. 이제 집으로 돌아가요.');
    btns.innerHTML=(g?`<button class="big alt" data-act="game">${GAMES[g]}</button>`:'')+'<button class="big" data-act="home">집으로</button>'}
  if(W.x+cw>W.genTo-200)gen(W.genTo,W.genTo+1200);
  const db=$('distbar');if(db)db.style.width=Math.min(100,W.x/W.len*100)+'%';
}
function spotResult(sp){const W=S.W;
  if(W.ev.length&&(sp.real||W.fakes>=2)){W.fakes=0;startEvent(W.ev.shift())}
  else{W.fakes++;toast(W.ev.length?'냄새만 맡았어요. 다른 곳을 찾아봐요':'냄새 맡기 끝! 계속 걸어요');sayWalk()}}
function startEvent(type){const W=S.W;holding=false;const wipe=type==='pee'&&S.C.ind,pm=type==='pee'&&!wipe?3:4.5;
  W.busy={type,wipe,st:'doing',t:0,dur:type==='pee'?1.6:2.2,praised:false,cleaned:type==='pee'&&!wipe,pt:pm,pmax:pm};
  dog.mood=type;btns.innerHTML='<button class="big" disabled>기다리는 중…</button>';
  say(type==='pee'?'쉬~ 하는 중이에요. 조용히 기다려 주세요.':'끙차… 응가하는 중이에요. 조용히 기다려 주세요.')}
function eventBtns(){const b=S.W.busy;let h='';
  if(!b.cleaned)h+=`<button class="big alt" data-act="clean">${b.type==='poo'?'봉투로 치우기':'물티슈로 닦기'}</button>`;
  if(!b.praised)h+=`<button class="big timer" data-act="praise" style="--p:${b.pt/b.pmax}">칭찬하기</button>`;
  btns.innerHTML=h}
ACT.praise=()=>{const b=S.W&&S.W.busy;if(!b||b.st!=='after'||b.praised)return;b.praised='ok';praiseUp(pick([`잘했어 ${N()}! 착하다~`,`최고야 ${N()}!`,`우리 ${N()} 천재!`]));eventBtns()};
ACT.clean=()=>{const b=S.W&&S.W.busy;if(!b||b.st!=='after'||b.cleaned)return;b.cleaned=true;if(b.type==='poo')S.W.poops.pop();toast(b.type==='poo'?'봉투로 깨끗하게 치웠어요':'물티슈로 싹 닦았어요','good');eventBtns()};
function endEvent(){const W=S.W;W.busy=null;W.doneN++;dog.mood='idle';renderTodo();walkBtns();sayWalk()}
ACT.home=()=>phasePaws();
ACT.game=()=>{const g=place().game;g==='fetch'?startFetch(phasePaws):startRun(phasePaws)};

/* ---------- 놀이 1: 공 던지기 ---------- */
function startFetch(after){S.phase='fetch';scene='fetch';dog.mood='idle';holding=false;
  S.F={n:0,max:3,st:'aim',pow:0,dir:1,charging:false,target:rand(.4,.92),land:0,t:0,dx:0,coins:0,after};
  ov.innerHTML='<div class="panel"><div class="fitlbl" id="fitlbl">공 던지기 · 1/3</div><div class="meter"><div class="fill" id="pfill"></div></div></div>';
  btns.innerHTML='<button class="big" data-charge="1">꾹 눌러 힘 모으기</button>';
  say('깃발 가까이 공을 던져요. 버튼을 꾹 눌러 힘을 모으고, 손을 떼면 던져요. 깃발이 멀수록 힘을 더!')}
const fx=p=>cw*(.3+.62*p);
function throwBall(){const Fz=S.F;Fz.charging=false;if(Fz.st!=='aim')return;let land=Fz.pow;
  if(!place().indoor&&(G.weather==='wind'||G.weather==='storm')){land-=.08;toast('바람에 공이 밀렸어요','warn')}
  Fz.land=clamp(land,0.02,1.05);sfx('throw');Fz.st='fly';Fz.t=0;btns.innerHTML='<button class="big" disabled>슈웅~</button>'}
function updFetch(dt){const Fz=S.F,s=dscale(),home=cw*.34;
  if(Fz.st==='aim'){if(Fz.charging){Fz.pow+=Fz.dir*dt*1.15;if(Fz.pow>=1){Fz.pow=1;Fz.dir=-1}if(Fz.pow<=0){Fz.pow=0;Fz.dir=1}}Fz.dx=home;dog.mood='idle'}
  else if(Fz.st==='fly'){Fz.t+=dt;dog.mood='happy';if(Fz.t>=.8){Fz.st='run';dog.mood='walk'}}
  else if(Fz.st==='run'){dog.walkPh+=dt*18;Fz.dx+=260*s*dt;if(Fz.dx>=fx(Fz.land)-10){Fz.st='back'}}
  else if(Fz.st==='back'){dog.walkPh+=dt*18;Fz.dx-=260*s*dt;if(Fz.dx<=home){Fz.dx=home;scoreFetch()}}
  const pf=$('pfill');if(pf)pf.style.width=Fz.pow*100+'%'}
function scoreFetch(){const Fz=S.F,err=Math.abs(Fz.land-Fz.target),tol=.07*(1+.6*G.up.ball);let c,m;
  if(err<tol){c=8;m='깃발에 딱! 완벽해요';praiseUp(m)}else if(err<tol*2.5){c=4;m='꽤 가까웠어요!';toast(m,'good');burst()}else{c=1;m=Fz.land>Fz.target?'너무 멀리 던졌어요':'조금 짧았어요';toast(m)}
  Fz.coins+=c;Fz.n++;dog.mood='happy';Fz.st='wait';
  later(()=>{if(Fz.n>=Fz.max){S.gameCoins+=Fz.coins;S.gameXP+=10;addMood(5);toast(`공 던지기 끝! 코인 +${Fz.coins}`,'good');const a=Fz.after;S.F=null;a()}
    else{Fz.st='aim';Fz.pow=0;Fz.dir=1;Fz.target=rand(.4,.92);$('fitlbl').textContent=`공 던지기 · ${Fz.n+1}/3`;btns.innerHTML='<button class="big" data-charge="1">꾹 눌러 힘 모으기</button>'}},1100)}

/* ---------- 놀이 2: 같이 달리기 ---------- */
function startRun(after){S.phase='run';scene='run';dog.mood='walk';holding=false;
  S.R={t:0,dur:12,sp:.3,zc:.5,zt:.5,zn:0,inz:0,x:0,after,zw:.28};
  ov.innerHTML='<div class="panel"><div class="fitlbl" id="fitlbl">같이 달리기 · 12초</div><div class="meter"><div class="zone" id="zone"></div><div class="mark" id="mark"></div></div></div>';
  btns.innerHTML='<button class="big" data-tap="1">달려!</button>';
  say('강아지 속도(줄무늬 칸)에 맞춰 달려요. "달려!"를 톡톡 눌러 속도를 올리고, 쉬면 느려져요.')}
function updRun(dt){const R=S.R;R.t+=dt;R.sp=Math.max(0,R.sp-dt*.36);R.zn-=dt;if(R.zn<=0){R.zn=rand(1.6,2.6);R.zt=rand(.25,.8)}
  R.zc+=(R.zt-R.zc)*dt*1.6;const ok=Math.abs(R.sp-R.zc)<R.zw/2;if(ok)R.inz+=dt;R.ok=ok;
  R.x+=(110+230*R.sp)*dscale()*dt;dog.walkPh+=dt*(9+12*R.sp);dog.mood='walk';
  const z=$('zone'),m=$('mark');if(z){z.style.left=(R.zc-R.zw/2)*100+'%';z.style.width=R.zw*100+'%'}if(m)m.style.left=`calc(${R.sp*100}% - 3px)`;
  const l=$('fitlbl');if(l)l.textContent=`같이 달리기 · ${Math.max(0,Math.ceil(R.dur-R.t))}초`;
  if(R.t>=R.dur){const sc=R.inz/R.dur,c=Math.round(sc*16)+2;S.gameCoins+=c;S.gameXP+=10;addMood(Math.round(sc*7));
    sc>.55?praiseUp(`호흡 척척! 코인 +${c}`):toast(`달리기 끝! 코인 +${c}`,'good');const a=R.after;S.R=null;S.phase='rundone';btns.innerHTML='';dog.mood='happy';later(a,1200)}}

/* =========================================================
   손그림 도구: 선이 살짝 삐뚤고, 1초에 4번 미세하게 떨려요(손그림 애니 느낌)
   ========================================================= */
function hr(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
let BOIL=0;
function wob(pts,closed,seed,j=1.4){ctx.beginPath();const n=pts.length;
  const Q=pts.map((p,i)=>[p[0]+(hr(seed+i*3.1+BOIL*7.7)-.5)*j*2,p[1]+(hr(seed+i*5.3+BOIL*3.3)-.5)*j*2]);
  if(!closed){ctx.moveTo(Q[0][0],Q[0][1]);for(let i=1;i<n-1;i++){ctx.quadraticCurveTo(Q[i][0],Q[i][1],(Q[i][0]+Q[i+1][0])/2,(Q[i][1]+Q[i+1][1])/2)}ctx.lineTo(Q[n-1][0],Q[n-1][1]);return}
  ctx.moveTo((Q[n-1][0]+Q[0][0])/2,(Q[n-1][1]+Q[0][1])/2);
  for(let i=0;i<n;i++){const a=Q[i],b=Q[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}ctx.closePath()}
function rectPts(x,y,w,h){const p=[],nx=Math.max(2,Math.round(w/26)),ny=Math.max(2,Math.round(h/26));
  for(let i=0;i<nx;i++)p.push([x+w*i/nx,y]);for(let i=0;i<ny;i++)p.push([x+w,y+h*i/ny]);
  for(let i=0;i<nx;i++)p.push([x+w-w*i/nx,y+h]);for(let i=0;i<ny;i++)p.push([x,y+h-h*i/ny]);return p}
function ellPts(cx,cy,rx,ry,n=14){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p}
function puffPts(cx,cy,rx,ry,n=18,k=1.14){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,r=i%2?1:k;p.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}return p}
/* 수채 채색 + 연필 선 */
function paint(pts,fill,seed,opt={}){const closed=!opt.open;
  if(fill){ctx.fillStyle=fill;ctx.globalAlpha=opt.a??.88;wob(pts,closed,seed+50,2.2);ctx.fill();ctx.globalAlpha=(opt.a??.88)*.4;wob(pts,closed,seed+90,3.2);ctx.fill();ctx.globalAlpha=1}
  if(opt.line!==false){ctx.strokeStyle=opt.color||INK;ctx.lineWidth=opt.lw||1.7;ctx.lineCap='round';ctx.lineJoin='round';wob(pts,closed,seed,opt.j??1.1);ctx.stroke()}}
function stroke(pts,seed,lw=1.6,color=INK){ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';wob(pts,false,seed,1);ctx.stroke()}
function dot(x,y,r){ctx.fillStyle=INK;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function heartPts(x,y,r,n=16){const p=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;p.push([x+r*.06*16*Math.pow(Math.sin(t),3),y-r*.06*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))])}return p}
function hheart(x,y,r,seed){paint(heartPts(x,y,r),'#F2A7A0',seed,{lw:1.5})}
function label(t,x,y,size,color=INK){ctx.font=`700 ${size}px Gaegu, sans-serif`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(t,x,y)}

/* 그림 한 장(스프라이트) 그리기: 발바닥 기준 */
function spr(k,x,y,h,o={}){const im=IMG[k];if(!im||!im.complete||!im.naturalWidth)return null;const w=h*im.naturalWidth/im.naturalHeight;
  ctx.save();ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);ctx.scale((o.flip?-1:1)*(o.sx||1),o.sy||1);
  ctx.drawImage(im,-w/2,-h,w,h);if(o.after)o.after(w,h);ctx.restore();return{w,h}}

  else if(expr==='wow'){dot(cx-ex,ey,R*.075);dot(cx+ex,ey,R*.075);paint(ellPts(cx,cy+R*.62,R*.08,R*.1,8),null,621,{lw:1.5})}
  else{dot(cx-ex,ey,R*.06);dot(cx+ex,ey,R*.06);stroke([[cx-R*.1,cy+R*.58],[cx,cy+R*.64],[cx+R*.1,cy+R*.58]],623,1.4)}}

function updParts(dt){const w=G.weather,gust=stopOn('wind');

function drawDog(x,y,s,side){const m=dog.mood,b=G.dog;let H=(side?66:84)*s;

    if(m==='walk'){yy-=Math.abs(Math.sin(dog.walkPh))*4*s;sy=1+Math.sin(dog.walkPh*2)*.03}

    if(m==='happy')yy-=Math.abs(Math.sin(T*8))*5*s;
    if(m==='idle')sy=1+Math.sin(T*3)*.015;
    pet(b,'side',x,yy,H,{flip:true,rot,sx,sy,after:(w,h)=>{dogClothes(w,h);harness(w,h,'side')}});return}
  let v=b==='pom'?'q':'front',o={};

  if(m==='sick'){v='front';o.sy=.86;o.sx=1.06}
  if(m==='idle')o.sy=1+Math.sin(T*3)*.015;
  o.after=(w,h)=>harness(w,h,'front');pet(b,v,x,y,H,o);

function drawSniff(x,y,s){const W=S.W;label('킁킁',x+62*s,y-56*s+Math.sin(T*10)*2,20*s);
  const p=Math.min(1,W.sniff/S.C.sniff),cx=x,cy=y-92*s;ctx.lineWidth=4;ctx.strokeStyle='#FFFDF8';ctx.beginPath();ctx.arc(cx,cy,11*s,0,7);ctx.stroke();
  ctx.strokeStyle='#E0A24A';ctx.beginPath();ctx.arc(cx,cy,11*s,-Math.PI/2,-Math.PI/2+p*Math.PI*2);ctx.stroke();ctx.lineWidth=1.2;ctx.strokeStyle=INK;ctx.beginPath();ctx.arc(cx,cy,13.5*s,0,7);ctx.stroke()}
function drawFace(){if(!face)return;const a=face.t<.15?face.t/.15:face.t>1.5?Math.max(0,1-(face.t-1.5)/.3):1;if(a<=0)return;
  const r=Math.min(46,cw*.12),cx=cw-r-12,cy=r+12;ctx.globalAlpha=a;
  paint(ellPts(cx,cy,r,r,16),'#FFFDF8',91,{lw:2,a:1});ctx.save();ctx.beginPath();ctx.arc(cx,cy,r-2,0,7);ctx.clip();if(G.who==='f')girlHead(cx,cy-r*.12,r*.66,face.e,false);else spr('f_'+face.e,cx,cy+r*.95,r*1.9);ctx.restore();ctx.globalAlpha=1}

/* ---------- 놀이 화면 ---------- */
function drawTitle(){const s=dscale(),g=ch*.8;ctx.fillStyle='#FBF1DE';ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle='rgba(237,187,82,.09)';for(let i=0;i<34;i++){ctx.beginPath();ctx.arc(hr(i)*cw,hr(i+9)*ch,24+hr(i+3)*44,0,7);ctx.fill()}
  const sx=cw*.85,sy=ch*.09;paint(ellPts(sx,sy,17,17,12),'#F5CD5C',1,{lw:1.5});for(let i=0;i<8;i++){const a=i/8*Math.PI*2+T*.2;stroke([[sx+Math.cos(a)*24,sy+Math.sin(a)*24],[sx+Math.cos(a)*31,sy+Math.sin(a)*31]],i+3,1.4)}
  [[.16,.47],[.86,.4]].forEach((q,i)=>paint(puffPts(cw*q[0]+Math.sin(T*.4+i)*6,ch*q[1],30,11,14,1.18),'#FFFFFF',80+i,{lw:1.4}));
  paint(ellPts(cw*.5,g+ch*.2,cw*.85,ch*.27,22),'#CFE0B6',701,{lw:1.6});
  for(let i=0;i<16;i++){const x=cw*(.04+hr(i*2.1)*.92),y=g+ch*.02+hr(i*5.7)*ch*.15;stroke([[x,y+8],[x+3,y],[x+7,y+8]],710+i,1.1,'#6F9460');
    if(i%3===0){paint(puffPts(x+18,y+2,5,5,10,1.3),['#F2A7A0','#F5CD5C','#FFFDF8'][i%9%3],730+i,{lw:1});dot(x+18,y+2,1.4)}}
  const h=Math.min(ch*.4,cw*.72);spr('together',cw*.5,g+ch*.07+Math.sin(T*2)*2,h);
  [[.2,.62,9],[.8,.58,11],[.72,.7,7]].forEach((q,i)=>hheart(cw*q[0]+Math.sin(T*1.3+i*2)*5,ch*q[1]+Math.cos(T*1.1+i)*5,q[2]*s,740+i))}
function drawFetch(){const Fz=S.F,s=dscale(),fy=feetY();bgPlace(0);if(!Fz)return;
  const tx=fx(Fz.target);stroke([[tx,fy+2*s],[tx,fy-64*s]],401,2);paint([[tx,fy-64*s],[tx+26*s,fy-55*s],[tx,fy-44*s]],'#E08A6E',403,{lw:1.5});paint(ellPts(tx,fy+3*s,22*s,5*s,12),null,405,{lw:1.2,color:'rgba(59,54,49,.5)'});
  const hand=drawPerson(cw*.16,fy,s,false,0);let bx,by;
  if(Fz.st==='aim'||Fz.st==='wait'){bx=Fz.st==='aim'?hand.x+6*s:Fz.dx-20*s;by=Fz.st==='aim'?hand.y-Fz.pow*10*s:fy-8*s}
  else if(Fz.st==='fly'){const k=Math.min(1,Fz.t/.8);bx=hand.x+(fx(Fz.land)-hand.x)*k;by=fy-8*s-Math.sin(k*Math.PI)*ch*.3-(1-k)*(fy-8*s-hand.y)}
  else if(Fz.st==='run'){bx=fx(Fz.land);by=fy-8*s}else{bx=Fz.dx+34*s;by=fy-30*s}
  drawDog(Fz.dx||cw*.34,fy,s,true);
  paint(ellPts(bx,by,7*s,7*s,10),G.up.ball?'#F2A7A0':'#D6E08A',407,{lw:1.4})}
function drawRun(){const R=S.R,s=dscale(),fy=feetY();bgPlace(R?R.x:0);if(!R){drawPerson(cw*.2,fy,s,false,0);drawDog(cw*.5,fy,s,true);return}
  const off=clamp((R.zc-R.sp)*130*s,-70*s,90*s),dx=cw*.5+off,hand=drawPerson(cw*.2,fy,s,true,dog.walkPh*1.4);
  drawLeash(hand,dx,fy,s,off>30*s);drawDog(dx,fy,s,true);
  if(R.ok)label('착착!',dx,fy-84*s,19*s);else label(R.sp<R.zc?'더 빨리!':'천천히!',cw*.2,fy-170*s,19*s,'#B5523A')}
function drawCafe(){const s=dscale(),g=ch*.6;ctx.fillStyle='#F6E9D6';ctx.fillRect(0,0,cw,g);
  paint(rectPts(cw*.06,ch*.08,cw*.5,ch*.14),'#FFFDF8',501,{lw:2});label('멍멍 카페',cw*.31,ch*.08+ch*.1,Math.min(30,cw*.07));
  for(let i=0;i<5;i++){const x=cw*(.66+i*.07);stroke([[x,0],[x,ch*.1+((i%2)*10)]],503+i,1.2);paint(ellPts(x,ch*.1+((i%2)*10)+8,7,9,8),'#F8DE8A',510+i,{lw:1.2})}
  paint(rectPts(cw*.62,g-70*s,cw*.34,70*s),'#D9AE78',520,{lw:1.8});paint(rectPts(cw*.6,g-78*s,cw*.38,10*s),'#C98B6B',521,{lw:1.6});
  paint([[cw*.7,g-78*s],[cw*.7+26*s,g-78*s],[cw*.7+22*s,g-100*s],[cw*.7+4*s,g-100*s]],'#FFFDF8',523,{lw:1.4});
  ctx.fillStyle='#E7C99C';ctx.fillRect(0,g,cw,ch-g);stroke([[0,g],[cw*.5,g+1],[cw,g]],99,1.8);
  paint(ellPts(cw*.3,g+(ch-g)*.5,cw*.26,(ch-g)*.3,18),'#CFE0B6',525,{lw:1.5,a:.8});
  person('front',cw*.12,g+26*s,Math.min(ch*.42,150*s));
  const rows=[g+(ch-g)*.45,g+(ch-g)*.85];
  S.pals.slice().sort((a,b)=>a.row-b.row).forEach((p,i)=>{const x=p.x*cw,y=rows[p.row]-(S.loose?Math.abs(Math.sin(p.ph))*8*s:0);
    if(!S.loose&&p.b===G.dog){const hx=cw*.12+20*s,hy=g-10*s;ctx.strokeStyle='#C0614B';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo((hx+x)/2,y,x,y-40*s);ctx.stroke()}
    pet(p.b,S.loose?'side':'front',x,y,(p.row?70:58)*s,{flip:S.loose&&p.v>0});
    if(p.b===G.dog)label(N(),x,y-(p.row?78:66)*s,15*s,'#B5523A')});
  S.pops.forEach((p,i)=>{ctx.globalAlpha=Math.max(0,Math.min(1,2.6-p.t));hheart(p.x+Math.sin(p.t*4)*5,p.y,13*s,i*9)});ctx.globalAlpha=1}

function draw(){BOIL=Math.floor(T*4)%3;ctx.clearRect(0,0,cw,ch);const p=dogScreen();let x=p.x,y=p.y;
  if(scene==='walk'&&S.W){const hand=drawWalk();if(dog.jump>0)y-=Math.sin(Math.PI*(1-dog.jump/.65))*44*p.s;
    drawLeash(hand,x,y,p.s,holding);drawDog(x,y,p.s,true);if(dog.mood==='sniff')drawSniff(x,y,p.s);
    const g=S.W.gust,k=S.C.stop;if(g.st==='gust'&&k&&k!=='wind'){const q=1-g.t/1.8,cx=cw+160*p.s-q*(cw+340*p.s),cy=feetY()+(ch-feetY())*.75;k==='car'?drawCar(cx,cy,p.s*1.1):k==='cart'?drawCart(cx,cy,p.s*1.2):k==='bike'?drawBike(cx,cy,p.s*1.25):drawWave(q,p.s)}
    if(!S.C.ind)drawParts(0,0,cw,ch,p.s)}
  else if(scene==='fetch')drawFetch();
  else if(scene==='run')drawRun();
  else if(scene==='cafe')drawCafe();
  else if(scene==='vet')drawVet();
  else if(scene==='title')drawTitle();
  else{drawHome();drawDog(x,y,p.s,false)}
  for(const h of hearts){if(h.t<0)continue;ctx.globalAlpha=Math.max(0,1-h.t/1.2);hheart(h.x+Math.sin(h.t*6)*6,h.y-h.t*70,10*p.s,h.r*100)}ctx.globalAlpha=1;
  drawFace()}

/* ---------- 메인 루프 ---------- */
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T+=dt;
  if(S.phase==='fit'){const Ft=S.fit;Ft.ph+=dt*S.C.speed*2;Ft.pos=(Math.sin(Ft.ph)+1)/2;const m=$('mark');if(m)m.style.left=`calc(${Ft.pos*100}% - 3px)`}
  if(S.phase==='walk'&&S.W)updWalk(dt);
  if(S.phase==='fetch'&&S.F)updFetch(dt);
  if(S.phase==='run'&&S.R)updRun(dt);
  if(S.phase==='cafe')updCafe(dt);
  if(S.phase==='tug'&&S.U)updTug(dt);
  bgm(dt);
  updParts(dt);hearts.forEach(h=>h.t+=dt);hearts=hearts.filter(h=>h.t<1.2);if(face){face.t+=dt;if(face.t>1.8)face=null}
  draw();requestAnimationFrame(frame)}
$('sndBtn').textContent=G.snd?'소리 켬':'소리 끔';titleScreen();requestAnimationFrame(frame);
</script>
